<section class="body">
<h1>이성율</h1>
<p class="place">캐나다 밴쿠버</p>
<div class="bar"></div>
<div class="intro">
<p>하나님을 사랑하며 피아노와 노래를 좋아합니다. 다정한 반려견과 함께 생활하며, 캐나다 밴쿠버에서 유학생들이 안심하고 거주할 수 있도록 임대사업을 하고 있습니다.</p>
<p>생소하고 낯선 나라에서 공부하는 일은 쉽지 않습니다. 말도, 음식도, 하루의 리듬도 모두 새로워서 마음이 지칠 때가 있습니다. 그럴 때 집이 따뜻한 쉼터가 되기를 바랍니다.</p>
</div>
<p class="msg">낯선 땅에서도 혼자가 아닙니다.<br>여러분의 도전을 진심으로 응원합니다.</p>
