<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030B1A">
<meta property="og:title" content="오늘의 말씀 · 부산교회">
<meta property="og:description" content="매일 주일만 빼고 순서대로 만나는 오늘의 말씀">
<title>오늘의 말씀 · 부산교회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;--gold-bright:#E8C76A;--gold-dim:rgba(201,168,76,0.16);
  --navy:#020B1A;--card-bg:rgba(8,20,46,0.72);
  --white:#F0EAD8;--muted:#A8AEBE;--dim:rgba(240,234,216,0.55);
  --border:rgba(201,168,76,0.25);--border-w:rgba(240,234,216,0.10);
  --kakao:#FEE500;--danger:#e56060;--success:#5eca8a;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  background:var(--navy);color:var(--white);
  font-family:'Noto Serif KR',serif;min-height:100vh;overflow-x:hidden;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.glow{
  position:fixed;bottom:-60px;left:50%;transform:translateX(-50%);
  width:160vw;height:260px;
  background:radial-gradient(ellipse at center bottom,rgba(139,94,82,0.25) 0%,transparent 70%);
  z-index:0;pointer-events:none;
}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 20px 80px;min-height:100vh}

/* HEADER */
.hd{display:flex;align-items:center;justify-content:space-between;padding:24px 0 16px}
.church-mark span{display:block}
.church-name{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:0.22em;color:var(--gold);font-weight:400}
.church-sub{font-size:10px;letter-spacing:0.12em;color:var(--muted)}
.date-wrap{text-align:right}
.date-day{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;color:var(--white);line-height:1}
.date-info{font-size:10px;letter-spacing:0.08em;color:var(--muted)}

/* NAV */
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
.nav-btn{
  background:var(--gold-dim);border:0.5px solid var(--border);border-radius:10px;
  color:var(--gold);font-size:12px;letter-spacing:0.08em;padding:8px 14px;cursor:pointer;
  font-family:'Noto Serif KR',serif;transition:opacity .15s;white-space:nowrap;flex-shrink:0;
}
.nav-btn:active{opacity:0.6}
.nav-btn:disabled{opacity:0.3;cursor:default}
.week-badge{
  background:var(--gold-dim);border:0.5px solid var(--border);border-radius:20px;
  padding:6px 16px;font-size:12px;letter-spacing:0.15em;color:var(--gold-bright);
  font-weight:500;text-align:center;flex:1;
}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.divider-line{flex:1;height:0.5px;background:var(--border)}
.divider-text{font-size:10px;letter-spacing:0.20em;color:var(--gold);white-space:nowrap;font-weight:500}

/* CROSS */
.cross-wrap{display:flex;justify-content:center;margin-bottom:18px;}

/* THEME */
.theme-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--gold-dim);
  border:0.5px solid var(--border);border-radius:40px;padding:5px 14px;
  font-size:11px;letter-spacing:0.18em;color:var(--gold-bright);font-weight:500;margin-bottom:18px;
}
.theme-dot{width:5px;height:5px;border-radius:50%;background:var(--gold-bright)}

/* CARDS */
.card{background:var(--card-bg);border:0.5px solid var(--border-w);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;margin-bottom:12px}
.card-in{padding:26px 24px}
.card-top{position:relative}
.card-top::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.verse-ref{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:0.22em;color:var(--gold);display:block;margin-bottom:16px;text-transform:uppercase}
.verse-text{font-size:18px;line-height:1.85;font-weight:400;color:var(--white);letter-spacing:0.02em}
.qopen{font-family:'Cormorant Garamond',serif;font-size:60px;line-height:0;color:var(--gold);opacity:0.32;vertical-align:-26px;margin-right:2px;font-weight:300}
.section-label{font-size:10px;letter-spacing:0.22em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-label::after{content:'';flex:1;height:0.5px;background:var(--border-w)}
.med-text{font-size:14.5px;line-height:1.92;color:var(--dim);font-weight:300;letter-spacing:0.02em}
.prayer-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.prayer-item{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7;color:var(--dim);font-weight:300}
.prayer-num{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold);flex-shrink:0;width:14px;text-align:center;margin-top:1px}

/* SHARE */
.share-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px}
.btn-kakao{
  width:100%;background:var(--kakao);border:none;border-radius:14px;
  padding:15px 24px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:#3A1D00;
  cursor:pointer;transition:transform .15s,opacity .15s;letter-spacing:0.03em;
}
.btn-kakao:active{transform:scale(0.97);opacity:.9}
.btn-copy{
  background:transparent;border:0.5px solid var(--border-w);border-radius:10px;
  padding:9px 24px;font-family:'Noto Serif KR',serif;font-size:12px;
  color:var(--muted);cursor:pointer;letter-spacing:0.10em;transition:opacity .15s;
}
.btn-copy:active{opacity:.6}

/* ADMIN TRIGGER */
.admin-trigger{
  position:fixed;bottom:24px;right:20px;z-index:50;
  background:rgba(8,20,46,0.85);border:0.5px solid var(--border);border-radius:50%;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(10px);color:var(--gold);font-size:18px;
  transition:opacity .15s;
}
.admin-trigger:active{opacity:.7}

/* SUNDAY */
.sunday-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:20px;text-align:center}
.sunday-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--white)}
.sunday-sub{font-size:14px;color:var(--muted);line-height:1.8;font-weight:300}
.sunday-verse{font-size:13px;color:var(--gold-bright);font-style:italic;line-height:1.7;max-width:280px}

/* FOOTER */
.footer{text-align:center;margin-top:40px;padding-top:20px;border-top:0.5px solid var(--border-w);font-size:10px;letter-spacing:0.12em;color:var(--muted);line-height:1.8;opacity:.6}

/* TOAST */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(201,168,76,0.92);color:#1a0f00;font-size:13px;font-weight:600;
  letter-spacing:0.08em;padding:11px 22px;border-radius:40px;opacity:0;
  transition:opacity .3s;pointer-events:none;z-index:999;font-family:'Noto Serif KR',serif;white-space:nowrap;
}
.toast.show{opacity:1}

/* ADMIN OVERLAY */
.admin-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(2,11,26,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;overflow:hidden;
  transition:opacity .3s;
}
.admin-overlay.hidden{display:none}
.admin-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 16px;border-bottom:0.5px solid var(--border-w);flex-shrink:0;
}
.admin-title{font-size:13px;letter-spacing:0.18em;color:var(--gold);font-weight:500}
.admin-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:4px}
.admin-body{flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}

/* LOGIN */
.login-box{max-width:340px;margin:60px auto 0;display:flex;flex-direction:column;gap:16px}
.login-label{font-size:12px;letter-spacing:0.15em;color:var(--muted);font-weight:500}
.admin-input{
  width:100%;background:rgba(8,20,46,0.8);border:0.5px solid var(--border);border-radius:10px;
  padding:13px 16px;font-family:'Noto Serif KR',serif;font-size:14px;color:var(--white);
  letter-spacing:0.05em;outline:none;transition:border-color .2s;
}
.admin-input:focus{border-color:var(--gold)}
.admin-input::placeholder{color:rgba(168,170,190,0.5)}
.admin-btn{
  width:100%;background:var(--gold-dim);border:0.5px solid var(--border);border-radius:10px;
  padding:13px;font-family:'Noto Serif KR',serif;font-size:14px;color:var(--gold-bright);
  cursor:pointer;letter-spacing:0.12em;font-weight:500;transition:opacity .15s;
}
.admin-btn:active{opacity:.7}
.admin-btn.danger{color:var(--danger);border-color:rgba(229,96,96,0.3);background:rgba(229,96,96,0.08)}
.admin-btn.success{color:var(--success);border-color:rgba(94,202,138,0.3);background:rgba(94,202,138,0.08)}
.login-error{font-size:12px;color:var(--danger);letter-spacing:0.08em;text-align:center;display:none}

/* ADMIN TABS */
.tab-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{
  background:var(--gold-dim);border:0.5px solid var(--border);border-radius:8px;
  padding:6px 12px;font-size:11px;letter-spacing:0.12em;color:var(--muted);
  cursor:pointer;transition:all .15s;font-family:'Noto Serif KR',serif;
}
.tab.active{background:rgba(201,168,76,0.3);color:var(--gold-bright);border-color:var(--gold)}

/* ENTRY LIST */
.entry-list{display:flex;flex-direction:column;gap:8px}
.entry-row{
  background:rgba(8,20,46,0.6);border:0.5px solid var(--border-w);border-radius:12px;
  overflow:hidden;
}
.entry-head{
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;
}
.entry-day{font-size:12px;letter-spacing:0.15em;color:var(--gold);font-weight:500}
.entry-ref{font-size:12px;color:var(--muted);letter-spacing:0.05em}
.entry-arrow{color:var(--muted);font-size:14px;transition:transform .2s}
.entry-row.open .entry-arrow{transform:rotate(90deg)}
.entry-body{display:none;padding:16px;border-top:0.5px solid var(--border-w)}
.entry-row.open .entry-body{display:block}
.field-label{font-size:10px;letter-spacing:0.15em;color:var(--muted);margin-bottom:6px;margin-top:12px}
.field-label:first-child{margin-top:0}
.admin-textarea{
  width:100%;background:rgba(2,11,26,0.8);border:0.5px solid var(--border);border-radius:8px;
  padding:10px 12px;font-family:'Noto Serif KR',serif;font-size:13px;color:var(--white);
  line-height:1.7;outline:none;resize:vertical;min-height:80px;transition:border-color .2s;
}
.admin-textarea:focus{border-color:var(--gold)}
.admin-textarea.sm{min-height:40px;resize:none}
.save-row{display:flex;gap:8px;margin-top:12px}
.save-btn{
  flex:1;background:rgba(201,168,76,0.2);border:0.5px solid var(--border);border-radius:8px;
  padding:10px;font-family:'Noto Serif KR',serif;font-size:12px;color:var(--gold-bright);
  cursor:pointer;letter-spacing:0.10em;transition:opacity .15s;
}
.save-btn:active{opacity:.7}

/* ADMIN FOOTER */
.admin-foot{
  padding:16px 20px;border-top:0.5px solid var(--border-w);flex-shrink:0;
  display:flex;gap:8px;align-items:center;
}
.admin-foot-btn{
  flex:1;background:transparent;border:0.5px solid var(--border-w);border-radius:8px;
  padding:9px;font-family:'Noto Serif KR',serif;font-size:11px;color:var(--muted);
  cursor:pointer;letter-spacing:0.08em;transition:opacity .15s;
}
.admin-foot-btn:active{opacity:.6}

/* ANIMATIONS */
.fade-in{animation:fadeup .6s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
.d4{animation-delay:.35s}.d5{animation-delay:.45s}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="glow"></div>

<div class="wrap">
  <div id="root"></div>
</div>

<button class="admin-trigger" onclick="openAdmin()" title="관리자">⚙</button>
<div id="toast" class="toast"></div>

<!-- ════════ ADMIN OVERLAY ════════ -->
<div id="admin-overlay" class="admin-overlay hidden">
  <div class="admin-header">
    <span class="admin-title" id="admin-panel-title">관리자 로그인</span>
    <button class="admin-close" onclick="closeAdmin()">✕</button>
  </div>
  <div class="admin-body" id="admin-body"></div>
  <div class="admin-foot" id="admin-foot" style="display:none">
    <button class="admin-foot-btn" onclick="exportData()">내보내기 (JSON)</button>
    <button class="admin-foot-btn" onclick="changePassword()">비밀번호 변경</button>
    <button class="admin-foot-btn" onclick="adminLogout()">로그아웃</button>
  </div>
</div>

<script>
/* ──────────────────────────────────────
   PROGRAM CONFIG
   시작일: 2026년 5월 4일 (월) = 1주 1일
   오늘  : 2026년 5월 18일 (월) = 3주 1일
────────────────────────────────────── */
const PROGRAM_START = new Date(2026, 4, 4); // Month 0-indexed
const STORAGE_KEY = 'busanChurch_v2';
const PW_KEY = 'busanChurch_pw';

/* ──────────────────────────────────────
   SCRIPTURE DATABASE
   형식: "주-일" → { ref, text, meditation, prayers:[3] }
────────────────────────────────────── */
const DEFAULTS = {
"1-1":{ref:"요한복음 1:1",text:"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라",meditation:"모든 것의 시작은 말씀이었습니다. 하나님의 말씀이 우리 삶의 출발점입니다. 오늘 이 말씀 앞에 서서 새로운 하루를 시작하십시오.",prayers:["말씀을 삶의 중심에 두게 하소서","하나님을 더 깊이 알아가는 한 주가 되게 하소서","우리 공동체가 말씀 위에 세워지게 하소서"]},
"1-2":{ref:"요한복음 1:14",text:"말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라",meditation:"하나님의 말씀이 육신이 되셨습니다. 추상적인 진리가 우리 곁에 오신 것입니다. 오늘 예수님이 내 삶 가운데 거하심을 기억하십시오.",prayers:["임마누엘 하나님의 임재를 경험하게 하소서","은혜와 진리가 넘치는 하루가 되게 하소서","교회 가운데 주님의 영광이 나타나게 하소서"]},
"1-3":{ref:"요한복음 1:16-17",text:"우리가 다 그의 충만한 데서 받으니 은혜 위에 은혜러라 율법은 모세로 말미암아 주어진 것이요 은혜와 진리는 예수 그리스도로 말미암아 온 것이라",meditation:"우리가 누리는 모든 것은 그분의 충만함에서 흘러나옵니다. 은혜 위에 은혜, 넘치는 하나님의 선하심을 오늘 누리십시오.",prayers:["은혜에 감사하는 마음을 허락하소서","율법이 아닌 은혜로 사는 삶이 되게 하소서","주님의 충만함을 주변과 나누게 하소서"]},
"1-4":{ref:"요한복음 1:29",text:"이튿날 요한이 예수께서 자기에게 나아오심을 보고 이르되 보라 세상 죄를 지고 가는 하나님의 어린 양이로다",meditation:"예수님은 세상 모든 죄를 짊어지신 어린 양입니다. 내 죄도 그 십자가에 놓여 있습니다. 오늘 그 사랑에 감사하며 나아가십시오.",prayers:["십자가의 사랑을 늘 기억하게 하소서","죄의 무거움에서 해방된 자로 살게 하소서","세상을 향한 복음의 선포자가 되게 하소서"]},
"1-5":{ref:"요한복음 1:37-39",text:"두 제자가 그의 말을 듣고 예수를 따르거늘 예수께서 돌아보시며 그 따르는 것을 보시고 물어 이르시되 무엇을 구하느냐 이르되 랍비여 어디 계시오니이까 하니 예수께서 이르시되 와서 보라 하시더라",meditation:"예수님의 첫 말씀은 '무엇을 구하느냐'였습니다. 오늘 예수님이 내게 물으십니다. 나는 무엇을 구하고 있습니까?",prayers:["주님을 먼저 구하는 하루가 되게 하소서","주님과 함께하는 시간을 기쁨으로 누리게 하소서","'와서 보라'는 초대에 응답하는 믿음을 주소서"]},
"1-6":{ref:"요한복음 2:1-2",text:"사흘째 되던 날 갈릴리 가나에 혼례가 있어 예수의 어머니도 거기 계시고 예수와 그 제자들도 혼례에 청함을 받았더니",meditation:"예수님은 평범한 삶의 자리에 초대받으셨습니다. 혼례, 일상, 관계 속에 함께하시는 주님을 만나십시오. 오늘 내 일상이 바로 그 자리입니다.",prayers:["일상의 자리에서 주님을 만나게 하소서","가정과 관계 안에서 주님의 임재를 경험하게 하소서","평범한 것을 특별하게 하시는 주님을 신뢰하게 하소서"]},

"2-1":{ref:"요한복음 3:5-6",text:"예수께서 대답하시되 진실로 진실로 네게 이르노니 사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라 육으로 난 것은 육이요 영으로 난 것은 영이니",meditation:"거듭남은 위로부터의 역사입니다. 내 힘이 아닌 성령의 능력으로 새사람이 됩니다. 오늘 성령의 역사하심에 나를 열어 드리십시오.",prayers:["성령으로 거듭난 삶이 더욱 풍성해지게 하소서","육의 생각이 아닌 영의 생각을 따르게 하소서","하나님 나라를 향한 삶을 살게 하소서"]},
"2-2":{ref:"요한복음 3:16",text:"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라",meditation:"하나님의 사랑은 가장 귀한 것을 주는 사랑입니다. 독생자를 내어 주셨습니다. 오늘 이 사랑을 받은 자로 하루를 살아가십시오.",prayers:["하나님의 사랑을 더 깊이 알게 하소서","받은 사랑을 이웃에게 흘려보내게 하소서","영생을 주신 은혜에 감사하게 하소서"]},
"2-3":{ref:"요한복음 4:13-14",text:"예수께서 대답하여 이르시되 이 물을 마시는 자마다 다시 목마르려니와 내가 주는 물을 마시는 자는 영원히 목마르지 아니하리니 내가 주는 물은 그 속에서 영생하도록 솟아나는 샘물이 되리라",meditation:"세상의 것으로는 갈증이 해결되지 않습니다. 예수님이 주시는 생수만이 영원한 만족을 줍니다. 오늘 그 샘에서 마시십시오.",prayers:["세상 것이 아닌 주님 안에서 만족을 찾게 하소서","생수의 강이 내 안에서 흘러넘치게 하소서","목마른 영혼들에게 복음을 전하게 하소서"]},
"2-4":{ref:"요한복음 5:24",text:"내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라",meditation:"믿음으로 우리는 이미 사망에서 생명으로 옮겨졌습니다. 미래의 일이 아니라 지금의 현실입니다. 오늘 생명 안에서 걸어가십시오.",prayers:["영생의 확신 가운데 담대히 살게 하소서","두려움이 아닌 생명의 기쁨으로 하루를 맞이하게 하소서","이 복음을 주변과 나누게 하소서"]},
"2-5":{ref:"요한복음 6:35",text:"예수께서 이르시되 나는 생명의 떡이니 내게 오는 자는 결코 주리지 아니할 터이요 나를 믿는 자는 영원히 목마르지 아니하리라",meditation:"예수님은 생명의 떡이십니다. 날마다 그분께 나아올 때 우리의 영적 굶주림이 채워집니다. 오늘 말씀과 기도로 그 떡을 먹으십시오.",prayers:["날마다 주님께 나아오는 습관을 갖게 하소서","영적으로 풍성히 먹고 마시게 하소서","영적 양식을 나누는 교회 공동체가 되게 하소서"]},
"2-6":{ref:"요한복음 8:31-32",text:"그러므로 예수께서 자기를 믿은 유대인들에게 이르시되 너희가 내 말에 거하면 참으로 내 제자가 되고 진리를 알지니 진리가 너희를 자유롭게 하리라",meditation:"진리가 우리를 자유하게 합니다. 말씀 안에 거하는 것이 제자의 표시입니다. 오늘 진리의 말씀 안에 머무르십시오.",prayers:["말씀 안에 거하는 제자의 삶을 살게 하소서","진리로 인한 자유를 충분히 누리게 하소서","거짓과 오류에서 진리로 돌아오게 하소서"]},

"3-1":{ref:"요한일서 5:16-17",text:"누구든지 자기 형제가 죽음에 이르지 않는 죄를 짓는 것을 보면 구하라. 그러면 하나님이 그에게 생명을 주실 것이다. 그것은 죽음에 이르지 않는 죄를 짓는 사람들에게 해당된다. 죽음에 이르는 죄가 있으니, 그런 죄에 대해서까지 기도하라고 말하는 것은 아니다. 모든 불의가 죄이지만, 죽음에 이르지 않는 죄도 있다",meditation:"우리는 서로를 위해 기도할 책임이 있습니다. 형제의 연약함을 볼 때 정죄가 아닌 기도로 나아가는 것, 그것이 사랑입니다. 오늘 내 주변의 지체들을 위해 중보하십시오.",prayers:["지체들을 위한 중보기도의 습관을 갖게 하소서","정죄보다 사랑으로 형제를 품게 하소서","공동체가 서로를 위해 기도하는 교회가 되게 하소서"]},
"3-2":{ref:"고린도후서 4:10, 12",text:"우리가 항상 예수의 죽음을 몸에 짊어짐은 예수의 생명이 또한 우리 몸에 나타나게 하려 함이라 ... 그런즉 사망은 우리 안에서 역사하고 생명은 너희 안에서 역사하느니라",meditation:"우리가 십자가의 고난을 짊어질 때 부활의 생명이 다른 이들에게 흘러갑니다. 나의 섬김과 희생이 공동체에 생명을 가져옵니다. 오늘 누군가를 위해 자신을 내어 드리십시오.",prayers:["십자가의 도를 기쁨으로 지게 하소서","나의 헌신이 지체들에게 생명이 되게 하소서","죽음을 이기는 부활의 능력을 체험하게 하소서"]},
"3-3":{ref:"에베소서 1:23 / 고린도전서 12:27 / 10:17",text:"교회는 그의 몸이니 만물 안에서 만물을 충만하게 하시는 이의 충만이니라(엡1:23) / 너희는 그리스도의 몸이요 지체의 각 부분이라(고전12:27) / 떡이 하나요 많은 우리가 한 몸이니 이는 우리가 다 한 떡에 참여함이라(고전10:17)",meditation:"교회는 그리스도의 몸입니다. 한 떡을 함께 나누는 공동체, 한 몸의 지체들입니다. 나 혼자가 아닌 서로가 연결된 한 몸임을 기억하며 오늘 지체들을 사랑하십시오.",prayers:["교회가 그리스도의 몸임을 더 깊이 깨닫게 하소서","각 지체가 제 역할을 온전히 감당하게 하소서","공동체 안에서 충만한 그리스도를 경험하게 하소서"]},
"3-4":{ref:"고린도전서 12:18, 20",text:"그러나 이제 하나님이 그 원하시는 대로 지체를 각각 몸에 두셨으니 ... 이제 지체는 많으나 몸은 하나라",meditation:"하나님이 각 사람을 그 원하시는 대로 몸에 두셨습니다. 내 위치가 우연이 아닙니다. 지금 내가 있는 자리가 하나님의 선택입니다. 오늘 내 자리에서 충실하십시오.",prayers:["내 위치와 역할에 감사하며 신실하게 하소서","다양한 지체들이 하나를 이루게 하소서","하나님의 배치에 불평하지 않고 순종하게 하소서"]},
"3-5":{ref:"고린도전서 12:14 / 사도행전 13:1",text:"몸은 한 지체뿐만 아니요 여럿이니(고전12:14) / 안디옥 교회에 선지자들과 교사들이 있으니 곧 바나바와 니게르라 하는 시므온과 구레네 사람 루기오와 분봉 왕 헤롯의 젖동생 마나엔과 및 사울이라(행13:1)",meditation:"몸은 다양한 지체들로 이루어져 있습니다. 안디옥 교회처럼 배경과 성향이 다른 사람들이 함께 모여 하나를 이룰 때 역사가 일어납니다. 오늘 다양성 안에서 하나됨을 추구하십시오.",prayers:["서로 다름을 존중하며 하나를 이루게 하소서","우리 교회도 안디옥 교회처럼 선교의 교회가 되게 하소서","각 지체의 은사가 서로를 세우는 데 쓰이게 하소서"]},
"3-6":{ref:"고린도후서 11:28-29",text:"이 외의 일은 고사하고 아직도 날마다 내 속에 눌리는 일이 있으니 곧 모든 교회를 위하여 걱정하는 것이라 누가 약하면 내가 약하지 아니하며 누가 실족하게 되면 내가 애타지 아니하더냐",meditation:"바울의 가장 큰 짐은 모든 교회를 위한 염려였습니다. 진정한 목자의 마음은 지체들의 약함을 함께 짊어집니다. 오늘 교회와 지체들을 위한 마음을 가지십시오.",prayers:["교회를 향한 뜨거운 마음을 갖게 하소서","약한 지체를 위해 함께 아파하게 하소서","지도자들이 바울의 마음으로 섬기게 하소서"]},

"4-1":{ref:"고린도후서 10:13-14 / 갈라디아서 2:8",text:"우리는 한량 없이 자랑하지 않고 오직 하나님이 우리에게 나누어 주신 그 범위의 한계를 따라 자랑하노니 곧 너희에게까지 이른 것이라 / 베드로에게 역사하사 그를 할례자의 사도로 삼으신 이가 또한 내게 역사하사 나를 이방인의 사도로 삼으셨느니라",meditation:"하나님은 각 사람에게 다른 분량을 주십니다. 내 분량 안에서 충성하는 것이 중요합니다. 남과 비교하지 말고 내게 주신 사명의 범위 안에서 신실하십시오.",prayers:["내게 주어진 분량을 감사히 받게 하소서","비교가 아닌 나만의 사명에 집중하게 하소서","하나님이 나를 통해 일하심을 신뢰하게 하소서"]},
"4-2":{ref:"고린도후서 10:15-16",text:"우리는 남의 수고를 가지고 분수 이상으로 자랑하는 것이 아니라 오직 너희 믿음이 자랄수록 우리의 규범을 따라 너희 가운데서 더욱 풍성하여지기를 바라노라 이는 남의 규범으로 이루어진 일들을 가지고 우리 영역 밖의 것들을 자랑하지 아니하고 너희 지역을 넘어서 복음을 전하려 함이라",meditation:"믿음이 자라면 사명도 확장됩니다. 안주하지 않고 더 넓은 땅을 향해 나아가는 것이 복음의 방향입니다. 오늘 내 믿음의 성장을 점검하십시오.",prayers:["믿음이 날마다 성장하게 하소서","더 넓은 곳으로 복음을 전하는 비전을 주소서","교회가 지역을 넘어 열방을 품게 하소서"]},
"4-3":{ref:"로마서 3:1-2",text:"그런즉 유대인의 나음이 무엇이며 할례의 유익이 무엇이냐 범사에 많으니 우선은 그들이 하나님의 말씀을 맡았음이니라",meditation:"하나님의 말씀을 맡은 것 자체가 큰 특권입니다. 우리는 말씀을 받은 자들입니다. 그 말씀을 소중히 여기고 지키며 전하는 것이 우리의 사명입니다.",prayers:["맡겨진 말씀을 귀히 여기게 하소서","말씀을 보존하고 전하는 자가 되게 하소서","하나님의 신실하심을 날마다 경험하게 하소서"]},
"4-4":{ref:"마태복음 6:10 / 에베소서 2:6",text:"나라가 임하시오며 뜻이 하늘에서 이루어진 것 같이 땅에서도 이루어지이다(마6:10) / 또 함께 일으키사 그리스도 예수 안에서 함께 하늘에 앉히시니(엡2:6)",meditation:"우리는 하늘에 앉혀진 자들로서 땅에 하나님 나라를 이루어 가는 사람들입니다. 오늘 내 삶의 자리에서 하나님의 뜻이 이루어지도록 기도하며 살아가십시오.",prayers:["오늘 내 삶에 하나님 나라가 임하게 하소서","하늘의 권위로 땅의 사명을 감당하게 하소서","우리 교회를 통해 하나님의 뜻이 이루어지게 하소서"]},
"4-5":{ref:"예레미야 1:10 / 디모데전서 6:12",text:"보라 내가 오늘 너를 여러 나라와 여러 왕국 위에 세워 네가 그것들을 뽑고 파괴하며 파멸하고 넘어뜨리며 건설하고 심게 하였느니라(렘1:10) / 믿음의 선한 싸움을 싸우라 영생을 취하라(딤전6:12)",meditation:"하나님의 부르심은 뽑고 파괴하기도 하지만, 건설하고 심기도 합니다. 선한 싸움을 두려워하지 마십시오. 오늘 믿음으로 앞에 놓인 사명을 감당하십시오.",prayers:["두려워하지 않고 사명을 감당하게 하소서","믿음의 선한 싸움에서 포기하지 않게 하소서","뽑고 세우는 하나님의 역사를 신뢰하게 하소서"]},
"4-6":{ref:"요한계시록 12:10 / 로마서 5:17",text:"이제 우리 하나님의 구원과 능력과 나라와 또 그의 그리스도의 권세가 나타났으니(계12:10) / 더욱 은혜와 의의 선물을 넘치게 받는 자들은 한 분 예수 그리스도를 통하여 생명 안에서 왕 노릇 하리로다(롬5:17)",meditation:"우리의 구원과 능력의 근원은 하나님입니다. 은혜를 넘치게 받은 우리는 생명 안에서 왕처럼 살 수 있습니다. 오늘 이 권세를 붙잡고 담대하게 살아가십시오.",prayers:["하나님의 나라와 권세 안에서 담대히 살게 하소서","은혜를 넘치게 받은 자로 살게 하소서","참소하는 자를 이기는 믿음을 허락하소서"]},

"5-1":{ref:"디모데전서 1:3-4 / 에베소서 3:11",text:"내가 마케도니아로 갈 때에 너를 에베소에 머물라 권한 것은 어떤 사람들을 명하여 다른 교훈을 가르치지 말며 신화와 끝없는 족보에 몰두하지 말게 하려 함이라(딤전1:3-4) / 곧 영원부터 우리 주 그리스도 예수 안에서 예정하신 뜻대로 하신 것이라(엡3:11)",meditation:"교회는 말씀의 순수성을 지켜야 합니다. 하나님의 영원한 뜻이 예수 그리스도 안에서 이루어집니다. 오늘 본질에 집중하고 비본질에 흔들리지 마십시오.",prayers:["교회가 순수한 복음을 지키게 하소서","하나님의 영원한 뜻을 분별하게 하소서","본질에 집중하는 신앙생활을 하게 하소서"]},
"5-2":{ref:"에베소서 3:2 / 고린도전서 1:25",text:"너희를 위하여 내게 주신 하나님의 그 은혜의 경륜을 너희가 들었을 터이라(엡3:2) / 하나님의 어리석음이 사람보다 지혜롭고 하나님의 약하심이 사람보다 강하니라(고전1:25)",meditation:"하나님의 지혜는 세상의 지혜와 다릅니다. 인간의 눈에 어리석어 보이는 십자가의 도가 가장 강한 능력입니다. 오늘 세상 지혜 대신 하나님의 경륜을 의지하십시오.",prayers:["하나님의 지혜를 신뢰하게 하소서","십자가의 도를 자랑스럽게 여기게 하소서","세상 지혜가 아닌 말씀으로 판단하게 하소서"]},
"5-3":{ref:"이사야 43:1 / 누가복음 12:1",text:"야곱아 너를 창조하신 여호와께서 지금 말씀하시느니라 이스라엘아 너를 지으신 이가 말씀하시느니라 너는 두려워하지 말라 내가 너를 구속하였고 내가 너를 지명하여 불렀나니 너는 내 것이라(사43:1) / 바리새인들의 누룩 곧 외식을 주의하라(눅12:1)",meditation:"하나님은 나를 지명하여 부르셨습니다. 두려움 없이 그분의 것으로 살아가십시오. 동시에 외식의 누룩을 경계하여 진실한 신앙을 지키십시오.",prayers:["하나님의 것으로 부름받은 자로 살게 하소서","외식과 위선에서 벗어나 진실하게 하소서","두려움이 아닌 확신으로 믿음 생활을 하게 하소서"]},
"5-4":{ref:"고린도전서 1:1 / 마태복음 5:3",text:"하나님의 뜻을 따라 그리스도 예수의 사도로 부르심을 받은 바울과(고전1:1) / 심령이 가난한 자는 복이 있나니 천국이 그들의 것임이요(마5:3)",meditation:"부르심을 받은 자의 삶은 심령이 가난한 데서 시작됩니다. 내 것으로 가득 찬 마음이 아닌, 하나님으로 채워지기를 원하는 마음이 복의 시작입니다.",prayers:["심령의 가난함으로 하나님을 더 의지하게 하소서","부르심에 합당하게 살게 하소서","천국이 이미 우리의 것임을 누리게 하소서"]},
"5-5":{ref:"빌립보서 2:3-4",text:"아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고 각각 자기 일을 돌볼뿐더러 또한 각각 다른 사람들의 일을 돌보아 나의 기쁨을 충만하게 하라",meditation:"겸손은 나를 낮추는 것이 아니라 남을 높이는 것입니다. 다른 사람의 일에도 관심을 갖는 것이 공동체를 세웁니다. 오늘 한 사람의 형편에 마음을 쓰십시오.",prayers:["겸손한 마음으로 다른 사람을 섬기게 하소서","공동체의 기쁨을 위해 나의 것을 내려놓게 하소서","다툼과 허영 대신 사랑으로 행하게 하소서"]},
"5-6":{ref:"마태복음 18:19 / 사도행전 1:14",text:"진실로 다시 너희에게 이르노니 너희 중의 두 사람이 땅에서 합심하여 무엇이든지 구하면 하늘에 계신 내 아버지께서 그들을 위하여 이루게 하시리라(마18:19) / 여자들과 예수의 어머니 마리아와 예수의 아우들과 더불어 마음을 같이하여 오로지 기도에 힘쓰더라(행1:14)",meditation:"두 사람이 합심하는 기도에 하나님이 응답하십니다. 초대 교회는 마음을 모아 기도에 힘썼습니다. 오늘 함께 기도하는 자리를 만드십시오.",prayers:["우리 교회가 합심하여 기도하는 교회가 되게 하소서","기도로 하나가 되는 공동체를 세워 주소서","기도의 자리를 지키는 신실함을 주소서"]},

"6-1":{ref:"요한복음 14:6, 23",text:"예수께서 이르시되 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라(14:6) / 예수께서 대답하여 이르시되 사람이 나를 사랑하면 내 말을 지키리니 내 아버지께서 그를 사랑하실 것이요 우리가 그에게 가서 거처를 그와 함께 하리라(14:23)",meditation:"예수님이 길이요 진리요 생명이십니다. 그 길 위에 머무는 자에게 아버지가 함께하십니다. 오늘 주님의 말씀을 지키며 그분의 임재 안에 거하십시오.",prayers:["예수님만이 유일한 길임을 고백하게 하소서","말씀을 지키는 사랑을 실천하게 하소서","하나님의 임재 안에 거하는 하루가 되게 하소서"]},
"6-2":{ref:"요한복음 16:13-15",text:"그러나 진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 스스로 말하지 않고 오직 들은 것을 말하며 장래 일을 너희에게 알리시리라 그가 내 영광을 나타내리니 내 것을 가지고 너희에게 알리시겠음이라",meditation:"성령님은 진리의 영으로 우리를 모든 진리 가운데 인도하십니다. 스스로 깨달으려 하기보다 성령의 인도하심에 귀를 열어 드리십시오. 오늘 성령의 음성에 민감하게 반응하십시오.",prayers:["성령의 인도하심에 민감하게 하소서","진리 안에서 명확한 방향을 찾게 하소서","성령이 충만한 삶을 살게 하소서"]},
"6-3":{ref:"요한복음 1:1 / 3:34 / 요한일서 2:2",text:"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라(요1:1) / 하나님이 보내신 이는 하나님의 말씀을 하나니 이는 하나님이 성령을 한량 없이 주심이니라(요3:34) / 그는 우리 죄를 위한 화목 제물이니 우리만 위할 뿐 아니요 온 세상의 죄를 위하심이라(요일2:2)",meditation:"말씀이신 예수님, 성령을 한량 없이 받으신 예수님, 온 세상의 화목 제물이신 예수님. 그분의 충만함이 우리의 필요를 모두 채우십니다.",prayers:["삼위일체 하나님을 더 깊이 알게 하소서","온 세상을 위한 화목 제물이신 주님께 감사하게 하소서","말씀과 성령으로 충만한 삶을 살게 하소서"]},
"6-4":{ref:"요한일서 2:1 / 요한계시록 22:13",text:"나의 자녀들아 내가 이것을 너희에게 씀은 너희로 죄를 범하지 않게 하려 함이라 만일 누가 죄를 범하여도 아버지 앞에서 우리에게 대언자가 있으니 곧 의로우신 예수 그리스도시라(요일2:1) / 나는 알파와 오메가요 처음과 마지막이요 시작과 마침이라(계22:13)",meditation:"죄를 범할 때 우리에게 대언자 예수님이 계십니다. 그분은 시작이요 마침이십니다. 실패와 좌절이 있어도 대언자이신 주님께 나아가십시오.",prayers:["죄를 지었을 때 대언자께 나아가는 믿음을 주소서","알파와 오메가이신 주님을 신뢰하게 하소서","시작부터 끝까지 주님이 함께하심을 확신하게 하소서"]},
"6-5":{ref:"요한계시록 3:7 / 요한일서 1:3",text:"빌라델비아 교회의 사자에게 편지하라 거룩하고 진실하사 다윗의 열쇠를 가지신 이 곧 열면 닫을 사람이 없고 닫으면 열 사람이 없는 그이가 이르시되(계3:7) / 우리가 보고 들은 바를 너희에게도 전함은 너희로 우리와 사귐이 있게 하려 함이니 우리의 사귐은 아버지와 그의 아들 예수 그리스도와 더불어 누림이라(요일1:3)",meditation:"열쇠를 가지신 주님이 여시는 문은 아무도 닫을 수 없습니다. 우리의 사귐은 아버지와 아들과 함께하는 사귐입니다. 오늘 주님이 여신 문으로 담대히 나아가십시오.",prayers:["주님이 열어 주신 문을 믿음으로 들어가게 하소서","성부 성자와의 깊은 사귐을 누리게 하소서","공동체의 사귐이 더욱 풍성해지게 하소서"]},
"6-6":{ref:"요한일서 2:27 / 요한계시록 21:9-10",text:"너희는 주께 받은 바 기름 부음이 너희 안에 거하나니 아무도 너희를 가르칠 필요가 없고 오직 그의 기름 부음이 모든 것을 너희에게 가르치며 또 참되고 거짓이 없으니 너희를 가르치신 그대로 주 안에 거하라(요일2:27) / 신부 곧 어린 양의 아내를 네게 보이리라 하고 성령으로 나를 데리고 크고 높은 산으로 올라가(계21:9-10)",meditation:"우리 안에 거하시는 성령의 기름 부음이 우리를 가르치십니다. 교회는 어린 양의 신부입니다. 오늘 주 안에 거하는 삶으로 그 부르심에 응답하십시오.",prayers:["성령의 기름 부음을 충만히 받게 하소서","주 안에 거하는 것을 삶의 원칙으로 삼게 하소서","교회가 어린 양의 신부로 단장되게 하소서"]},

"7-1":{ref:"고린도후서 13:14 / 시편 36:8-9",text:"주 예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통하심이 너희 무리와 함께 있을지어다(고후13:14) / 그들이 주의 집에 있는 살진 것으로 풍족할 것이라 주께서 주의 복락의 강물을 마시게 하시리이다 진실로 생명의 원천이 주께 있사오니 주의 빛 안에서 우리가 빛을 보리이다(시36:8-9)",meditation:"삼위일체 하나님의 은혜, 사랑, 교통하심이 우리와 함께합니다. 그분의 집에서 풍족하고 생명의 강물을 마시는 삶, 오늘 그 복락을 누리십시오.",prayers:["삼위일체 하나님의 동행하심을 경험하게 하소서","주의 집에서 풍족함을 누리게 하소서","생명의 원천이신 주님께 날마다 나아가게 하소서"]},
"7-2":{ref:"시편 31:3 / 요한일서 4:19",text:"주는 나의 반석과 산성이시니 그러므로 주의 이름을 생각하셔서 나를 인도하시고 지도하소서(시31:3) / 우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라(요일4:19)",meditation:"우리가 사랑할 수 있는 것은 그분이 먼저 사랑하셨기 때문입니다. 반석이신 주님이 인도하시기 때문에 우리는 사랑할 수 있습니다. 오늘 먼저 받은 사랑으로 나아가십시오.",prayers:["주님의 먼저 사랑하심을 더 깊이 받아들이게 하소서","반석이신 주님을 의지하게 하소서","받은 사랑으로 이웃을 사랑하게 하소서"]},
"7-3":{ref:"시편 133:1-3",text:"보라 형제가 연합하여 동거함이 어찌 그리 선하고 아름다운고 머리에 있는 보배로운 기름이 수염 곧 아론의 수염에 흘러서 그의 옷깃까지 내림 같고 헐몬의 이슬이 시온의 산들에 내림 같도다 거기서 여호와께서 복을 명령하셨나니 곧 영생이로다",meditation:"형제가 연합하여 함께 사는 것, 얼마나 선하고 아름다운지요! 공동체의 하나됨이 임할 때 하나님이 복을 명하십니다. 오늘 교회의 하나됨을 위해 기도하십시오.",prayers:["우리 교회에 아름다운 연합이 임하게 하소서","분열이 아닌 하나됨을 추구하게 하소서","형제 사랑이 헐몬의 이슬처럼 흘러내리게 하소서"]},
"7-4":{ref:"요한일서 1:2-3",text:"이 생명이 나타내신 바 된지라 이 영원한 생명을 우리가 보았고 증언하여 너희에게 전하노니 이는 아버지와 함께 계시다가 우리에게 나타내신 바 된 이시니라 우리가 보고 들은 바를 너희에게도 전함은 너희로 우리와 사귐이 있게 하려 함이니",meditation:"영원한 생명을 보았고 들었습니다. 그 경험이 증언이 됩니다. 우리가 경험한 예수님을 전할 때 사귐이 넓어집니다. 오늘 내 경험을 누군가와 나누십시오.",prayers:["경험한 것을 증언하는 담대함을 주소서","영원한 생명의 실재를 더 깊이 경험하게 하소서","사귐이 넓어지는 전도의 삶을 살게 하소서"]},

"7-6":{ref:"요한계시록 22:1 / 고린도전서 10:16",text:"또 그가 수정 같이 맑은 생명수의 강을 내게 보이니 하나님과 및 어린 양의 보좌로부터 나와서(계22:1) / 우리가 축복하는 바 축복의 잔은 그리스도의 피에 참여함이 아니며 우리가 떼는 떡은 그리스도의 몸에 참여함이 아니냐(고전10:16)",meditation:"생명수의 강이 하나님 보좌에서 흘러나옵니다. 우리가 함께 나누는 성찬은 그 생명에 참여하는 것입니다. 오늘 주님의 몸과 피에 참여하는 삶의 의미를 묵상하십시오.",prayers:["성찬의 의미를 더 깊이 이해하게 하소서","생명수의 강이 교회 가운데 흐르게 하소서","주님의 몸과 피에 참여하는 거룩함을 유지하게 하소서"]},

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getData(key) {
  const stored = loadData();
  return stored[key] || DEFAULTS[key] || null;
}
function setData(key, value) {
  const stored = loadData();
  stored[key] = value;
  saveData(stored);
}
function getAdminPw() {
  return localStorage.getItem(PW_KEY) || 'busan2024';
}

/* ──────────────────────────────────────
   DATE LOGIC
   Start: May 4, 2026 (Mon) = Week 1, Day 1
   Today: May 18, 2026 (Mon) = Week 3, Day 1
────────────────────────────────────── */
function getProgramIndex(date) {
  const start = new Date(PROGRAM_START);
  start.setHours(0,0,0,0);
  const d = new Date(date);
  d.setHours(0,0,0,0);
  if (d < start) return null;
  if (d.getDay() === 0) return null; // Sunday
  let count = 0;
  const cur = new Date(start);
  while (cur <= d) {
    if (cur.getDay() !== 0) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count - 1;
}
function getWeekDay(date) {
  if (date.getDay() === 0) return null;
  const idx = getProgramIndex(date);
  if (idx === null || idx < 0) return null;
  return { week: Math.floor(idx / 6) + 1, day: (idx % 6) + 1 };
}
function dateFromWeekDay(week, day) {
  const idx = (week - 1) * 6 + (day - 1);
  const result = new Date(PROGRAM_START);
  let count = 0;
  while (count < idx) {
    result.setDate(result.getDate() + 1);
    if (result.getDay() !== 0) count++;
  }
  return result;
}
function isSunday(date) { return date.getDay() === 0; }
function navigateDay(d, dir) {
  const next = new Date(d);
  do { next.setDate(next.getDate() + dir); } while (next.getDay() === 0);
  return next;
}

/* ──────────────────────────────────────
   STAR CANVAS
────────────────────────────────────── */
(function(){
  const c = document.getElementById('sky');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
  function initStars() {
    stars = [];
    const n = Math.floor((c.width * c.height) / 3200);
    for (let i = 0; i < n; i++) {
      stars.push({ x:Math.random()*c.width, y:Math.random()*c.height*0.8,
        r:Math.random()*1.3+0.2, a:Math.random(), da:(Math.random()-.5)*0.008 });
    }
  }
  function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='rgb(2,11,26)'; ctx.fillRect(0,0,c.width,c.height);
    for (const s of stars) {
      s.a += s.da; if(s.a>1||s.a<0.1) s.da*=-1;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(240,234,216,${s.a})`; ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();initStars()});
  resize(); initStars(); draw();
})();

function kakaoIcon() {
  return `<svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <ellipse cx="10" cy="9" rx="8.5" ry="7" fill="#3A1D00"/>
    <path d="M6.5 9.5C6.5 7.3 8.1 6.2 10 6.2s3.5 1.1 3.5 3.3c0 1.8-1.4 2.9-3.5 2.9-.5 0-1-.1-1.5-.3L7.2 13.2l.4-1.8c-.7-.6-1.1-1.2-1.1-1.9Z" fill="#FEE500"/>

function toast(msg, dur=2400) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}
function shareText(wd, sc, dateStr) {
  const p = sc.prayers ? sc.prayers.map((p,i)=>`${i+1}. ${p}`).join('\n') : '';
  return `📖 오늘의 말씀 · 부산교회\n${wd ? `${wd.week}주 ${wd.day}일 · ` : ''}${dateStr}\n\n"${sc.text}"\n— ${sc.ref}\n\n✍ 묵상\n${sc.meditation}${p ? `\n\n🙏 기도제목\n${p}` : ''}`;
}

/* ──────────────────────────────────────
   MAIN RENDER
────────────────────────────────────── */
function render() {
  const root = document.getElementById('root');
  const wd = getWeekDay(viewDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const vd = new Date(viewDate); vd.setHours(0,0,0,0);
  const isToday = vd.getTime() === today.getTime();

  const prevDate = navigateDay(viewDate, -1);
  const nextDate = navigateDay(viewDate, 1);
  const prevWd = getWeekDay(prevDate);
  const nextWd = getWeekDay(nextDate);

  const dateStr = formatDate(viewDate);
  const dayNum = String(viewDate.getDate()).padStart(2,'0');

  // prev/next disabled state
  const prevDisabled = new Date(prevDate).setHours(0,0,0,0) < new Date(PROGRAM_START).setHours(0,0,0,0);

  if (isSunday(viewDate)) {
    root.innerHTML = `
      <div class="hd fade-in">
        <div class="church-mark"><span class="church-name">BUSAN CHURCH</span><span class="church-sub">부산교회 · 매일 말씀</span></div>
        <div class="date-wrap"><div class="date-day">${dayNum}</div><div class="date-info">${viewDate.getFullYear()} · ${MONTHS[viewDate.getMonth()]} · 일요일</div></div>
      </div>
      <div class="nav-row fade-in d1">
        <button class="nav-btn" onclick="goPrev()">◀ ${prevWd?`${prevWd.week}주 ${prevWd.day}일`:''}</button>
        <div class="week-badge">주 일</div>
        <button class="nav-btn" onclick="goNext()">${nextWd?`${nextWd.week}주 ${nextWd.day}일`:''} ▶</button>
      </div>
      <div class="sunday-wrap fade-in d2">
        ${cross()}
        <div class="sunday-title">주일 안식</div>
        <p class="sunday-sub">오늘은 함께 예배하는 날입니다<br>부산교회에서 뵙겠습니다</p>
        <p class="sunday-verse">"사람이 성전에 와서 예배할 때마다<br>하나님이 그의 기도를 들으신다"</p>
      </div>
      <div class="footer fade-in d3">부산교회 · 주일 예배 시간을 확인해 주세요</div>`;
    return;
  }

  if (!wd) {
    root.innerHTML = `
      <div class="hd fade-in"><div class="church-mark"><span class="church-name">BUSAN CHURCH</span><span class="church-sub">부산교회 · 매일 말씀</span></div>
        <div class="date-wrap"><div class="date-day">${dayNum}</div><div class="date-info">${viewDate.getFullYear()} · ${MONTHS[viewDate.getMonth()]}</div></div></div>
      <div class="sunday-wrap fade-in d2">${cross()}
        <p class="sunday-sub">말씀 일정 준비 중입니다</p></div>`;
    return;
  }

  const key = `${wd.week}-${wd.day}`;
  const sc = getData(key);

  if (!sc) {
    root.innerHTML = `
      <div class="hd fade-in"><div class="church-mark"><span class="church-name">BUSAN CHURCH</span></div></div>
      <div class="sunday-wrap fade-in d2">${cross()}
        <p class="sunday-sub">${wd.week}주 ${wd.day}일<br>말씀을 관리자 페이지에서 입력해 주세요</p>
        <button class="nav-btn" style="margin-top:16px" onclick="openAdmin()">관리자 입력</button></div>`;
    return;
  }

  const prayers = sc.prayers || [];
  root.innerHTML = `
    <div class="hd fade-in">
      <div class="church-mark"><span class="church-name">BUSAN CHURCH</span><span class="church-sub">부산교회 · 매일 말씀</span></div>
      <div class="date-wrap"><div class="date-day">${dayNum}</div><div class="date-info">${viewDate.getFullYear()} · ${MONTHS[viewDate.getMonth()]} · ${WEEKDAYS[viewDate.getDay()]}요일</div></div>
    </div>

    <div class="nav-row fade-in d1">
      <button class="nav-btn" onclick="goPrev()" ${prevDisabled?'disabled':''}>◀ ${prevWd?`${prevWd.week}주 ${prevWd.day}일`:'이전'}</button>
      <div class="week-badge">${wd.week}주 ${wd.day}일${isToday?' · 오늘':''}</div>
      <button class="nav-btn" onclick="goNext()">${nextWd?`${nextWd.week}주 ${nextWd.day}일`:'다음'} ▶</button>
    </div>

    <div class="divider fade-in d1"><div class="divider-line"></div><span class="divider-text">오늘의 영적 날씨</span><div class="divider-line"></div></div>
    <div class="cross-wrap fade-in d1">${cross()}</div>
    <div class="fade-in d1"><span class="theme-chip"><span class="theme-dot"></span>${sc.ref}</span></div>

    <div class="card card-top fade-in d2">
      <div class="card-in">
        <span class="verse-ref">${formatDate(viewDate)} · ${wd.week}주 ${wd.day}일</span>
        <p class="verse-text"><span class="qopen">"</span>${sc.text}"</p>
      </div>
    </div>

    <div class="card fade-in d3">
      <div class="card-in">
        <div class="section-label">오늘의 묵상</div>
        <p class="med-text">${sc.meditation}</p>
      </div>
    </div>

    ${prayers.length ? `<div class="card fade-in d4"><div class="card-in">
      <div class="section-label">기도제목</div>
      <ul class="prayer-list">${prayers.map((p,i)=>`
        <li class="prayer-item"><span class="prayer-num">${i+1}</span><span>${p}</span></li>`).join('')}
      </ul></div></div>` : ''}

    <div class="share-wrap fade-in d5">
      <button class="btn-kakao" onclick="shareWord()">
        ${kakaoIcon()} 오늘 말씀 카카오톡으로 공유하기
      </button>
      <button class="btn-copy" onclick="copyWord()">텍스트 복사</button>
    </div>

    <div class="footer fade-in d5">
      부산교회 · 주일만 빼고 매일 새벽 00:00 갱신<br>
      <span style="opacity:.6;font-size:10px">오늘의 말씀: ${wd.week}주 ${wd.day}일 · ${dateStr}</span>
    </div>`;
}

/* ──────────────────────────────────────
   NAVIGATION
────────────────────────────────────── */
function goPrev() {
  viewDate = navigateDay(viewDate, -1);
  if (new Date(viewDate).setHours(0,0,0,0) < new Date(PROGRAM_START).setHours(0,0,0,0)) {
    viewDate = new Date(PROGRAM_START);
  }
  render();
}
function goNext() { viewDate = navigateDay(viewDate, 1); render(); }
function goToday() { viewDate = new Date(); render(); }

/* ──────────────────────────────────────
   SHARE
────────────────────────────────────── */
function shareWord() {
  const wd = getWeekDay(viewDate);
  const key = wd ? `${wd.week}-${wd.day}` : null;
  const sc = key ? getData(key) : null;
  if (!sc) return;
  const text = shareText(wd, sc, formatDate(viewDate));
  if (navigator.share) navigator.share({title:'오늘의 말씀 · 부산교회', text}).catch(()=>{});
  else navigator.clipboard.writeText(text).then(()=>toast('카카오톡에 붙여넣기하여 공유하세요 ✓')).catch(()=>toast('공유 기능을 지원하지 않습니다'));
}
function copyWord() {
  const wd = getWeekDay(viewDate);
  const key = wd ? `${wd.week}-${wd.day}` : null;
  const sc = key ? getData(key) : null;
  if (!sc) return;
  navigator.clipboard.writeText(shareText(wd, sc, formatDate(viewDate))).then(()=>toast('클립보드에 복사되었습니다 ✓')).catch(()=>toast('복사에 실패했습니다'));
}

/* ──────────────────────────────────────
   ADMIN
────────────────────────────────────── */
function openAdmin() {
  document.getElementById('admin-overlay').classList.remove('hidden');
  if (adminLoggedIn) renderAdminEditor();
  else renderAdminLogin();
}
function closeAdmin() {
  document.getElementById('admin-overlay').classList.add('hidden');
  render();
}
function adminLogout() {
  adminLoggedIn = false;
  document.getElementById('admin-foot').style.display = 'none';
  renderAdminLogin();
}

function renderAdminLogin() {
  document.getElementById('admin-panel-title').textContent = '관리자 로그인';
  document.getElementById('admin-foot').style.display = 'none';
  document.getElementById('admin-body').innerHTML = `
    <div class="login-box">
      <div style="text-align:center;margin-bottom:24px">${cross()}</div>
      <div class="login-label">관리자 비밀번호</div>
      <input type="password" class="admin-input" id="pw-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="admin-btn" onclick="doLogin()">로그인</button>
      <div class="login-error" id="login-err">비밀번호가 올바르지 않습니다</div>
      <div style="font-size:11px;color:rgba(168,170,190,.5);text-align:center;margin-top:8px;letter-spacing:.08em">기본 비밀번호: busan2024</div>
    </div>`;
  setTimeout(()=>{ const el=document.getElementById('pw-input'); if(el) el.focus(); }, 100);
}

function doLogin() {
  const pw = document.getElementById('pw-input').value;
  if (pw === getAdminPw()) {
    adminLoggedIn = true;
    renderAdminEditor();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

function renderAdminEditor() {
  document.getElementById('admin-panel-title').textContent = '말씀 관리';
  document.getElementById('admin-foot').style.display = 'flex';

  // Build tabs for weeks 1-8
  const tabs = Array.from({length:8},(_,i)=>i+1).map(w =>
    `<button class="tab ${w===activeTab?'active':''}" onclick="setTab(${w})">${w}주</button>`
  ).join('');

  // Entries for active tab
  const entries = Array.from({length:6},(_,i)=>i+1).map(d => buildEntryRow(activeTab, d)).join('');

  // Today indicator
  const todayWd = getWeekDay(new Date());
  const todayBadge = todayWd ? `<div style="font-size:11px;letter-spacing:.10em;color:rgba(201,168,76,.7);margin-bottom:12px">📅 오늘: ${todayWd.week}주 ${todayWd.day}일</div>` : '';

  document.getElementById('admin-body').innerHTML = `
    ${todayBadge}
    <div class="tab-row">${tabs}</div>
    <div style="font-size:11px;color:rgba(168,170,190,.5);letter-spacing:.08em;margin-bottom:12px">항목을 클릭하면 편집할 수 있습니다</div>
    <div class="entry-list" id="entry-list">${entries}</div>`;
}

function buildEntryRow(week, day) {
  const key = `${week}-${day}`;
  const sc = getData(key);
  const ref = sc ? sc.ref : '(미입력)';
  const isOpen = openEntry === key;
  const dateStr = (() => {
    try { return formatDate(dateFromWeekDay(week, day)); } catch { return ''; }
  })();

  let bodyHtml = '';
  if (isOpen) {
    const prayers = sc ? (sc.prayers||[]) : [];
    bodyHtml = `<div class="entry-body">
      <div class="field-label">📖 성경 구절 (참조)</div>
      <input class="admin-input" id="f-ref-${key}" value="${esc(sc?sc.ref:'')}" placeholder="예: 요한복음 3:16">
      <div class="field-label">📝 말씀 본문</div>
      <textarea class="admin-textarea" id="f-text-${key}" rows="4">${esc(sc?sc.text:'')}</textarea>
      <div class="field-label">✍ 묵상</div>
      <textarea class="admin-textarea" id="f-med-${key}" rows="3">${esc(sc?sc.meditation:'')}</textarea>
      <div class="field-label">🙏 기도제목 1</div>
      <textarea class="admin-textarea sm" id="f-p1-${key}">${esc(prayers[0]||'')}</textarea>
      <div class="field-label">🙏 기도제목 2</div>
      <textarea class="admin-textarea sm" id="f-p2-${key}">${esc(prayers[1]||'')}</textarea>
      <div class="field-label">🙏 기도제목 3</div>
      <textarea class="admin-textarea sm" id="f-p3-${key}">${esc(prayers[2]||'')}</textarea>
      <div class="save-row">
        <button class="save-btn" onclick="saveEntry('${key}')">저장</button>
        <button class="save-btn" onclick="resetEntry('${key}')" style="flex:0.5;color:var(--muted)">초기화</button>
      </div>
    </div>`;
  }

  return `<div class="entry-row ${isOpen?'open':''}" id="row-${key}">
    <div class="entry-head" onclick="toggleEntry('${key}')">
      <div>
        <div class="entry-day">${week}주 ${day}일${dateStr?` · <span style="font-weight:300;font-size:11px;color:var(--muted)">${dateStr}</span>`:''}</div>
        <div class="entry-ref">${ref}</div>
      </div>
      <span class="entry-arrow">▶</span>
    </div>
    ${bodyHtml}
  </div>`;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleEntry(key) {
  openEntry = openEntry === key ? null : key;
  const [w,d] = key.split('-').map(Number);
  renderEntryList(w);
}
function setTab(w) {
  activeTab = w; openEntry = null;
  renderAdminEditor();
}
function renderEntryList(week) {
  const entries = Array.from({length:6},(_,i)=>i+1).map(d => buildEntryRow(week, d)).join('');
  document.getElementById('entry-list').innerHTML = entries;
}
function saveEntry(key) {
  const ref = document.getElementById(`f-ref-${key}`).value.trim();
  const text = document.getElementById(`f-text-${key}`).value.trim();
  const med = document.getElementById(`f-med-${key}`).value.trim();
  const p1 = document.getElementById(`f-p1-${key}`).value.trim();
  const p2 = document.getElementById(`f-p2-${key}`).value.trim();
  const p3 = document.getElementById(`f-p3-${key}`).value.trim();
  const prayers = [p1,p2,p3].filter(Boolean);
  setData(key, { ref, text, meditation:med, prayers });
  openEntry = null;
  toast('저장되었습니다 ✓');
  const [w] = key.split('-').map(Number);
  renderEntryList(w);
}
function resetEntry(key) {
  if (!confirm('이 항목을 기본값으로 초기화하시겠습니까?')) return;
  const stored = loadData();
  delete stored[key];
  saveData(stored);
  openEntry = null;
  const [w] = key.split('-').map(Number);
  renderEntryList(w);
  toast('초기화되었습니다');
}
function exportData() {
  const data = { defaults: DEFAULTS, overrides: loadData() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `busan-church-scriptures-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('내보내기 완료');
}
function changePassword() {
  const newPw = prompt('새 비밀번호를 입력하세요:');
  if (!newPw || newPw.length < 4) { alert('비밀번호는 4자 이상이어야 합니다'); return; }
  const confirm2 = prompt('새 비밀번호를 한 번 더 입력하세요:');
  if (newPw !== confirm2) { alert('비밀번호가 일치하지 않습니다'); return; }
  localStorage.setItem(PW_KEY, newPw);
  toast('비밀번호가 변경되었습니다 ✓');
}

/* ──────────────────────────────────────
   INIT
────────────────────────────────────── */
render();
</script>
</body>
</html>
