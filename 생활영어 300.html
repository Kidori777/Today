<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>생활영어 핵심 300선 - 카드 학습</title>
<style>
:root{
  --bg:#f4f7f6;
  --bg-elev:#ffffff;
  --ink:#1a1a1a;
  --ink-soft:#555;
  --muted:#8a8f98;
  --accent:#2c5edb;
  --accent-soft:#e8edfc;
  --accent-ink:#1f3f9e;
  --good:#1f9d55;
  --good-soft:#e5f6ec;
  --bad:#d64545;
  --bad-soft:#fbe9e9;
  --card-front:#ffffff;
  --card-back:#2c3e50;
  --card-back-ink:#ffffff;
  --border:#e4e7ec;
  --shadow:0 6px 20px rgba(20,25,40,0.08);
  --radius:18px;
  --font-kr:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#14161a;
    --bg-elev:#1d2026;
    --ink:#eef0f3;
    --ink-soft:#c3c7ce;
    --muted:#8a8f98;
    --accent:#6d8dff;
    --accent-soft:#232a45;
    --accent-ink:#b7c4ff;
    --good:#4bd07e;
    --good-soft:#173425;
    --bad:#ff7a7a;
    --bad-soft:#3a1f21;
    --card-front:#1d2026;
    --card-back:#0f2a4a;
    --card-back-ink:#eef0f3;
    --border:#2c313a;
    --shadow:0 6px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14161a;
  --bg-elev:#1d2026;
  --ink:#eef0f3;
  --ink-soft:#c3c7ce;
  --muted:#8a8f98;
  --accent:#6d8dff;
  --accent-soft:#232a45;
  --accent-ink:#b7c4ff;
  --good:#4bd07e;
  --good-soft:#173425;
  --bad:#ff7a7a;
  --bad-soft:#3a1f21;
  --card-front:#1d2026;
  --card-back:#0f2a4a;
  --card-back-ink:#eef0f3;
  --border:#2c313a;
  --shadow:0 6px 24px rgba(0,0,0,0.4);
}

*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--font-kr);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:40px;
}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 8px;}

header.top{
  text-align:center;
  margin-bottom:14px;
}
header.top h1{
  font-size:1.5rem;
  font-weight:800;
  margin:0 0 4px;
  word-break:keep-all;
}
header.top p{
  margin:0;
  color:var(--muted);
  font-size:0.9rem;
}

.mode-toggle{
  display:flex;
  gap:6px;
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-radius:14px;
  padding:5px;
  margin:14px 0;
  box-shadow:var(--shadow);
}
.mode-toggle button{
  flex:1;
  border:none;
  background:transparent;
  padding:10px 8px;
  border-radius:10px;
  font-size:0.92rem;
  font-weight:700;
  color:var(--muted);
  cursor:pointer;
  font-family:inherit;
  transition:background .15s, color .15s;
}
.mode-toggle button.active{
  background:var(--accent);
  color:#fff;
}

.search-box{
  width:100%;
  padding:11px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg-elev);
  color:var(--ink);
  font-size:0.95rem;
  margin-bottom:12px;
  font-family:inherit;
}
.search-box::placeholder{color:var(--muted);}

.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.chip{
  flex:0 0 auto;
  padding:8px 14px;
  border-radius:20px;
  background:var(--bg-elev);
  border:1px solid var(--border);
  color:var(--ink-soft);
  font-size:0.85rem;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  font-family:inherit;
}
.chip.active{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}

/* ---------- Flashcard mode ---------- */
.flash-stage{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:6px;
}
.progress-line{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:0.82rem;
  color:var(--muted);
  margin-bottom:10px;
}
.progress-bar-track{
  flex:1;
  height:5px;
  background:var(--border);
  border-radius:3px;
  margin:0 10px;
  overflow:hidden;
}
.progress-bar-fill{
  height:100%;
  background:var(--accent);
  border-radius:3px;
  transition:width .2s;
}

.card-scene{
  width:100%;
  max-width:480px;
  aspect-ratio:4/3;
  perspective:1400px;
  margin-bottom:16px;
}
@media (max-width:420px){
  .card-scene{aspect-ratio:3/3.1;}
}
.flip-card{
  position:relative;
  width:100%;
  height:100%;
  transition:transform .45s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
  cursor:pointer;
}
.flip-card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  gap:10px;
}
.face-front{
  background:var(--card-front);
  border:1px solid var(--border);
}
.face-back{
  background:var(--card-back);
  color:var(--card-back-ink);
  transform:rotateY(180deg);
}
.card-num{
  position:absolute;
  top:14px;
  left:16px;
  font-size:0.75rem;
  font-weight:800;
  color:var(--accent);
  background:var(--accent-soft);
  padding:3px 9px;
  border-radius:10px;
}
.face-back .card-num{
  color:#cfe0ff;
  background:rgba(255,255,255,0.12);
}
.card-hint{
  position:absolute;
  bottom:14px;
  font-size:0.72rem;
  color:var(--muted);
}
.face-back .card-hint{color:rgba(255,255,255,0.55);}
.eng-text{
  font-size:1.5rem;
  font-weight:800;
  line-height:1.35;
  word-break:keep-all;
}
.ipa-text{
  font-size:0.9rem;
  color:var(--muted);
  font-family:'Courier New',monospace;
}
.kor-text{
  font-size:1.4rem;
  font-weight:800;
  line-height:1.4;
  word-break:keep-all;
}
.ex-text{
  font-size:0.92rem;
  color:rgba(255,255,255,0.85);
  white-space:pre-line;
  line-height:1.5;
  border-top:1px solid rgba(255,255,255,0.2);
  padding-top:10px;
  margin-top:4px;
}

.nav-controls{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  max-width:480px;
}
.nav-btn{
  flex:0 0 auto;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--bg-elev);
  color:var(--ink);
  font-size:1.2rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow);
}
.nav-btn:active{transform:scale(0.94);}
.mark-btns{
  flex:1;
  display:flex;
  gap:8px;
}
.mark-btn{
  flex:1;
  padding:12px 4px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg-elev);
  font-weight:800;
  font-size:0.85rem;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink-soft);
}
.mark-btn.know{color:var(--good);}
.mark-btn.dont{color:var(--bad);}
.mark-btn.know.active{background:var(--good-soft);border-color:var(--good);}
.mark-btn.dont.active{background:var(--bad-soft);border-color:var(--bad);}

.util-row{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:14px;
}
.util-btn{
  padding:9px 16px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg-elev);
  color:var(--ink-soft);
  font-size:0.85rem;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
}
.util-btn.warn{color:var(--bad);}

/* ---------- List mode ---------- */
.list-view{display:flex;flex-direction:column;gap:10px;}
.list-item{
  background:var(--bg-elev);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  box-shadow:var(--shadow);
  cursor:pointer;
}
.list-item .row1{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
}
.list-item .num{
  font-size:0.72rem;
  font-weight:800;
  color:var(--accent);
  background:var(--accent-soft);
  padding:2px 8px;
  border-radius:9px;
  flex:0 0 auto;
}
.list-item .eng{
  font-size:1.05rem;
  font-weight:700;
  flex:1;
}
.list-item .ipa{
  font-size:0.8rem;
  color:var(--muted);
  font-family:'Courier New',monospace;
  margin-top:2px;
}
.list-item .kor{
  font-size:0.95rem;
  color:var(--ink-soft);
  margin-top:6px;
  font-weight:600;
  max-height:0;
  overflow:hidden;
  transition:max-height .2s;
}
.list-item .ex{
  font-size:0.85rem;
  color:var(--muted);
  white-space:pre-line;
  margin-top:6px;
  max-height:0;
  overflow:hidden;
  transition:max-height .2s;
}
.list-item.open .kor,.list-item.open .ex{max-height:200px;}
.list-item.open{border-color:var(--accent);}

.section-title{
  font-size:0.85rem;
  font-weight:800;
  color:var(--muted);
  margin:18px 0 8px 4px;
}

.empty-msg{
  text-align:center;
  color:var(--muted);
  padding:40px 10px;
}

.done-banner{
  text-align:center;
  background:var(--good-soft);
  color:var(--good);
  border-radius:14px;
  padding:20px;
  font-weight:700;
  margin-bottom:14px;
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>생활영어 핵심 300선</h1>
    <p>카드로 넘기며 익히는 실전 표현 300개</p>
  </header>

  <div class="mode-toggle">
    <button id="tabFlash" class="active">🃏 카드 학습</button>
    <button id="tabList">📋 목록 보기</button>
  </div>

  <input id="searchBox" class="search-box" type="text" placeholder="영어 또는 한글 표현 검색... (예: 도와주세요, help)">

  <div id="chipRow" class="chip-row"></div>

  <div id="flashSection" class="flash-stage">
    <div class="progress-line">
      <span id="progressLabel">1 / 300</span>
      <div class="progress-bar-track"><div id="progressFill" class="progress-bar-fill" style="width:0%"></div></div>
      <span id="markSummary">✅0 ❌0</span>
    </div>

    <div class="card-scene">
      <div id="flipCard" class="flip-card">
        <div class="face face-front">
          <span id="numFront" class="card-num">#1</span>
          <div id="engText" class="eng-text"></div>
          <div id="ipaText" class="ipa-text"></div>
          <div class="card-hint">탭하면 뜻이 보여요 👆</div>
        </div>
        <div class="face face-back">
          <span id="numBack" class="card-num">#1</span>
          <div id="korText" class="kor-text"></div>
          <div id="exText" class="ex-text"></div>
          <div class="card-hint">다시 탭하면 앞면으로</div>
        </div>
      </div>
    </div>

    <div class="nav-controls">
      <button id="prevBtn" class="nav-btn">‹</button>
      <div class="mark-btns">
        <button id="dontKnowBtn" class="mark-btn dont">❌ 모르겠음</button>
        <button id="knowBtn" class="mark-btn know">✅ 외웠음</button>
      </div>
      <button id="nextBtn" class="nav-btn">›</button>
    </div>

    <div class="util-row">
      <button id="shuffleBtn" class="util-btn">🔀 랜덤 섞기</button>
      <button id="unknownOnlyBtn" class="util-btn">🎯 모르는 것만</button>
      <button id="resetBtn" class="util-btn warn">↺ 기록 초기화</button>
    </div>
  </div>

  <div id="listSection" class="list-view" style="display:none;"></div>
</div>

<script id="data-payload" type="application/json"></script>
<script>

 "eng": "I’m looking for…", "ipa": "(aɪm ˈlʊkɪŋ fɔr)", "kor": "…을 찾고 있어요", "ex": "I'm looking for my dog."}, {"num": 295, "eng": "I can’t find…", "ipa": "(aɪ kænt faɪnd)", "kor": "…을 찾을 수 없어요", "ex": "I can't find my passport."}, {"num": 296, "eng": "Please help me.", "ipa": "(pliz hɛlp mi)", "kor": "제발 도와주세요", "ex": "Someone is following me.\nPlease help me."}, {"num": 297, "eng": "I need a doctor immediately.", "ipa": "(aɪ nid ə ˈdɑktər ɪˈmidɪətli)", "kor": "즉시 의사가 필요해요", "ex": "He is bleeding.\nI need a doctor immediately."}, {"num": 298, "eng": "I’m hurt.", "ipa": "(aɪm hɜrt)", "kor": "다쳤어요", "ex": "I broke my leg.\nI'm hurt."}, {"num": 299, "eng": "Call the fire department!", "ipa": "(kɔl ðə ˈfaɪər dɪˌpɑrtmənt)", "kor": "소방서에 전화하세요!", "ex": "Smoke is coming out.\nCall the fire department!"}, {"num": 300, "eng": "Help!", "ipa": "(hɛlp)", "kor": "도와주세요!", "ex": "Help! Help!\nI'm drowning!"}]}];
</script>
<script>
(function(){
  // Flatten all cards with section index
  const sections = DATA.map((s,i)=>({title:s.title, items:s.items}));
  const allCards = [];
  sections.forEach((s, si)=>{
    s.items.forEach(it=>{
      allCards.push(Object.assign({}, it, {sectionIndex:si, sectionTitle:s.title}));
    });
  });

  const STORE_KEY = 'life-eng-300-progress-v1';
  let progress = {}; // num -> 'know' | 'dont'
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) progress = JSON.parse(raw);
  }catch(e){ progress = {}; }
  function saveProgress(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){}
  }

  let currentFilterSection = 'all'; // 'all' or index
  let searchTerm = '';
  let unknownOnly = false;
  let deck = []; // current working list of cards (respect filter/search/unknownOnly), possibly shuffled
  let flashIndex = 0;
  let flipped = false;

  const chipRow = document.getElementById('chipRow');
  const searchBox = document.getElementById('searchBox');
  const tabFlash = document.getElementById('tabFlash');
  const tabList = document.getElementById('tabList');
  const flashSection = document.getElementById('flashSection');
  const listSection = document.getElementById('listSection');

  function buildChips(){
    chipRow.innerHTML = '';
    const allChip = document.createElement('div');
    allChip.className = 'chip active';
    allChip.textContent = '전체 300';
    allChip.onclick = ()=>{ currentFilterSection='all'; refreshChipActive(); rebuildDeck(); };
    chipRow.appendChild(allChip);
    sections.forEach((s, si)=>{
      const c = document.createElement('div');
      c.className = 'chip';
      const shortTitle = s.title.replace(/^\d+\.\s*/, '');
      c.textContent = shortTitle;
      c.onclick = ()=>{ currentFilterSection = si; refreshChipActive(); rebuildDeck(); };
      c.dataset.section = si;
      chipRow.appendChild(c);
    });
  }
  function refreshChipActive(){
    Array.from(chipRow.children).forEach((c, idx)=>{
      const isAll = idx===0;
      c.classList.toggle('active', (isAll && currentFilterSection==='all') || (!isAll && currentFilterSection===(idx-1)));
    });
  }

  function matchesFilter(card){
    if(currentFilterSection!=='all' && card.sectionIndex!==currentFilterSection) return false;
    if(unknownOnly && progress[card.num]==='know') return false;
    if(searchTerm){
      const t = searchTerm.toLowerCase();
      if(!(card.eng.toLowerCase().includes(t) || card.kor.toLowerCase().includes(t))) return false;
    }
    return true;
  }

  function rebuildDeck(keepOrder){
    const base = allCards.filter(matchesFilter);
    deck = base;
    flashIndex = 0;
    flipped = false;
    renderFlash();
    renderList();
  }

  function countKnown(){
    let k=0,d=0;
    deck.forEach(c=>{
      if(progress[c.num]==='know') k++;
      else if(progress[c.num]==='dont') d++;
    });
    return {k,d};
  }

  function renderFlash(){
    const progressLabel = document.getElementById('progressLabel');
    const progressFill = document.getElementById('progressFill');
    const markSummary = document.getElementById('markSummary');
    const flipCard = document.getElementById('flipCard');

    if(deck.length===0){
      progressLabel.textContent = '0 / 0';
      progressFill.style.width='0%';
      markSummary.textContent = '✅0 ❌0';
      document.getElementById('engText').textContent = '조건에 맞는 카드가 없어요';
      document.getElementById('ipaText').textContent = '';
      document.getElementById('korText').textContent = '';
      document.getElementById('exText').textContent = '';
      document.getElementById('numFront').textContent='';
      document.getElementById('numBack').textContent='';
      flipCard.classList.remove('flipped');
      return;
    }
    if(flashIndex>=deck.length) flashIndex = deck.length-1;
    if(flashIndex<0) flashIndex = 0;
    const card = deck[flashIndex];
    progressLabel.textContent = (flashIndex+1) + ' / ' + deck.length;
    progressFill.style.width = ((flashIndex+1)/deck.length*100) + '%';
    const {k,d} = countKnown();
    markSummary.textContent = '✅' + k + ' ❌' + d;

    document.getElementById('numFront').textContent = '#' + card.num;
    document.getElementById('numBack').textContent = '#' + card.num;
    document.getElementById('engText').textContent = card.eng;
    document.getElementById('ipaText').textContent = card.ipa;
    document.getElementById('korText').textContent = card.kor;
    document.getElementById('exText').textContent = card.ex;

    flipCard.classList.toggle('flipped', flipped);

    updateMarkButtons(card);
  }

  function updateMarkButtons(card){
    const knowBtn = document.getElementById('knowBtn');
    const dontBtn = document.getElementById('dontKnowBtn');
    knowBtn.classList.toggle('active', progress[card.num]==='know');
    dontBtn.classList.toggle('active', progress[card.num]==='dont');
  }

  function renderList(){
    listSection.innerHTML='';
    if(deck.length===0){
      const empty = document.createElement('div');
      empty.className='empty-msg';
      empty.textContent='조건에 맞는 표현이 없어요.';
      listSection.appendChild(empty);
      return;
    }
    let lastSection = null;
    deck.forEach(card=>{
      if(currentFilterSection==='all' && card.sectionIndex!==lastSection){
        lastSection = card.sectionIndex;
        const h = document.createElement('div');
        h.className='section-title';
        h.textContent = card.sectionTitle;
        listSection.appendChild(h);
      }
      const item = document.createElement('div');
      item.className='list-item';
      item.innerHTML = `
        <div class="row1">
          <span class="num">#${card.num}</span>
          <span class="eng">${escapeHtml(card.eng)}</span>
        </div>
        <div class="ipa">${escapeHtml(card.ipa)}</div>
        <div class="kor">${escapeHtml(card.kor)}</div>
        <div class="ex">${escapeHtml(card.ex)}</div>
      `;
      item.onclick = ()=>{ item.classList.toggle('open'); };
      listSection.appendChild(item);
    });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Flip interaction
  document.getElementById('flipCard').addEventListener('click', ()=>{
    if(deck.length===0) return;
    flipped = !flipped;
    document.getElementById('flipCard').classList.toggle('flipped', flipped);
  });

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(deck.length===0) return;
    flashIndex = (flashIndex-1+deck.length)%deck.length;
    flipped = false;
    renderFlash();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(deck.length===0) return;
    flashIndex = (flashIndex+1)%deck.length;
    flipped = false;
    renderFlash();
  });

  document.getElementById('knowBtn').addEventListener('click', ()=>{
    if(deck.length===0) return;
    const card = deck[flashIndex];
    progress[card.num] = progress[card.num]==='know' ? undefined : 'know';
    if(progress[card.num]===undefined) delete progress[card.num];
    saveProgress();
    renderFlash();
  });
  document.getElementById('dontKnowBtn').addEventListener('click', ()=>{
    if(deck.length===0) return;
    const card = deck[flashIndex];
    progress[card.num] = progress[card.num]==='dont' ? undefined : 'dont';
    if(progress[card.num]===undefined) delete progress[card.num];
    saveProgress();
    renderFlash();
  });

  document.getElementById('shuffleBtn').addEventListener('click', ()=>{
    for(let i=deck.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]] = [deck[j],deck[i]];
    }
    flashIndex = 0;
    flipped = false;
    renderFlash();
    renderList();
  });

  const unknownOnlyBtn = document.getElementById('unknownOnlyBtn');
  unknownOnlyBtn.addEventListener('click', ()=>{
    unknownOnly = !unknownOnly;
    unknownOnlyBtn.classList.toggle('active', unknownOnly);
    unknownOnlyBtn.style.background = unknownOnly ? 'var(--accent-soft)' : '';
    unknownOnlyBtn.style.color = unknownOnly ? 'var(--accent-ink)' : '';
    unknownOnlyBtn.style.borderColor = unknownOnly ? 'var(--accent)' : '';
    rebuildDeck();
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('학습 기록(외웠음/모르겠음 표시)을 모두 초기화할까요?')){
      progress = {};
      saveProgress();
      renderFlash();
    }
  });

  searchBox.addEventListener('input', (e)=>{
    searchTerm = e.target.value.trim();
    rebuildDeck();
  });

  tabFlash.addEventListener('click', ()=>{
    tabFlash.classList.add('active');
    tabList.classList.remove('active');
    flashSection.style.display='flex';
    listSection.style.display='none';
  });
  tabList.addEventListener('click', ()=>{
    tabList.classList.add('active');
    tabFlash.classList.remove('active');
    flashSection.style.display='none';
    listSection.style.display='flex';
  });

  // keyboard support (desktop)
  document.addEventListener('keydown', (e)=>{
    if(flashSection.style.display==='none') return;
    if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
    else if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
    else if(e.key===' '){ e.preventDefault(); document.getElementById('flipCard').click(); }
  });

  buildChips();
  rebuildDeck();
})();
</script>
</body>
</html>
