<style>
  :root{
    --bg: #F3ECDC;
    --panel: #FBF7EC;
    --line: #D8C49C;
    --ink: #241C14;
    --sub: #6E5C43;
    --gold: #9C6C22;
    --jade: #385444;
    --jade-bg: #E7EEE7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif KR', serif;}

  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:18px 20px 0;
  }
  .title-row{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 16px;
    max-width:920px; margin:0 auto;
  }
  h1{font-size:1.5rem; font-weight:700; margin:0 0 12px;}
  .subtitle{color:var(--sub); font-size:0.88rem; margin:0 0 14px;}

  nav{
    max-width:920px; margin:0 auto;
    display:flex; gap:6px; overflow-x:auto;
    padding-bottom:12px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:transparent;
    color:var(--sub);
    font-family:'Noto Serif KR', serif;
    font-size:0.85rem;
    padding:8px 14px;
    border-radius:2px;
    cursor:pointer;
    white-space:nowrap;
  }
  nav button.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#fff;
  }
  nav button:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  main{max-width:920px; margin:0 auto; padding:24px 20px 80px;}
  section{display:none;}
  section.active{display:block;}

  .group-label{
    font-size:0.8rem; color:var(--sub);
    margin:28px 0 10px; padding-top:14px;
    border-top:1px solid var(--line);
  }
  .group-label:first-child{margin-top:0; padding-top:0; border-top:none;}

  .grid{
    display:grid; grid-template-columns:1fr; gap:12px;
  }
  @media(min-width:680px){
    .grid{grid-template-columns:1fr 1fr;}
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--gold);
    padding:14px 16px;
  }
  .ko{font-family:'Noto Serif KR', serif; font-weight:600; font-size:1.02rem; margin:0 0 8px;}
  .km{
    font-family:'Noto Sans Khmer','Noto Sans KR', sans-serif;
    font-weight:600; font-size:1.35rem; color:var(--jade);
    margin:0 0 6px; line-height:1.5;
  }
  .pron{font-size:0.92rem; color:var(--sub); margin:0;}

  /* sequential script sections */
  .steps{list-style:none; margin:0; padding:0; counter-reset:step;}
  .step{
    position:relative;
    padding:6px 0 26px 38px;
    border-left:1px solid var(--line);
    margin-left:14px;
  }
  .step:last-child{border-left:1px solid transparent;}
  .step::before{
    counter-increment:step;
    content:counter(step);
    position:absolute; left:-14px; top:0;
    width:28px; height:28px;
    background:var(--gold); color:#fff;
    border-radius:50%;
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center;
  }
  .step h3{font-size:0.98rem; margin:0 0 10px 4px; color:var(--ink);}
  .step .note{
    font-size:0.85rem; color:var(--sub); margin:8px 0 0 4px;
  }
  .step .card{margin-left:4px;}
  .step .grid{margin-left:4px;}

  /* method section */
  .method-list{list-style:none; margin:0; padding:0;}
  .method-list li{
    background:var(--jade-bg);
    border:1px solid var(--line);
    padding:16px 18px;
    margin-bottom:10px;
    font-family:'Noto Serif KR', serif;
    font-size:1.05rem;
    color:var(--jade);
    font-weight:600;
  }
  .method-note{color:var(--sub); font-family:'Noto Sans KR', sans-serif; font-weight:400; font-size:0.9rem; margin-top:24px;}

  footer{
    max-width:920px; margin:0 auto; padding:0 20px 40px;
    color:var(--sub); font-size:0.8rem;
  }
</style>
</head>

  </div>`;
}

function renderSection(sec){
  if(sec.type === "cards"){
    return sec.groups.map(g => `
      <div class="group-label">${g.title}</div>
      <div class="grid">${g.items.map(cardHTML).join("")}</div>
    `).join("");
  }
  if(sec.type === "steps"){
    return `<ol class="steps">${sec.steps.map(s => `
      <li class="step">
        <h3>${s.title}</h3>
        <div class="grid">${s.items.map(cardHTML).join("")}</div>
        ${s.note ? `<p class="note">${s.note}</p>` : ""}
      </li>
    `).join("")}</ol>`;
  }
  if(sec.type === "method"){
    return `<ul class="method-list">${sec.items.map(t => `<li>${t}</li>`).join("")}</ul>
      <p class="method-note">${sec.note}</p>`;
  }
  return "";
}

DATA.forEach((sec, i) => {
  const btn = document.createElement("button");
  btn.textContent = sec.label;
  btn.dataset.id = sec.id;
  if(i === 0) btn.classList.add("active");
  btn.addEventListener("click", () => showSection(sec.id));
  tabsEl.appendChild(btn);

  const section = document.createElement("section");
  section.id = sec.id;
  if(i === 0) section.classList.add("active");
  section.innerHTML = renderSection(sec);
  mainEl.appendChild(section);
});

function showSection(id){
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo({top:0, behavior:"smooth"});
}
</script>
