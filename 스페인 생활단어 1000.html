<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스페인어 생활단어 1000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF6EC;
    --ink: #26211A;
    --ink-soft: #6b6152;
    --azulejo: #1F5C6B;
    --azulejo-deep: #164450;
    --sol: #E2A63B;
    --clavel: #C24A3E;
    --line: #DED2B8;
    --card: #FFFFFF;
    --chip-bg: #F0E6D0;
    --chip-active-bg: #1F5C6B;
    --chip-active-fg: #FBF6EC;
    --shadow: rgba(38,33,26,0.10);
    --known-bg: #ECF3E3;
    --known-fg: #4E7A34;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1B1712;
      --ink: #F2ECDF;
      --ink-soft: #B8AC94;
      --azulejo: #6FB3C4;
      --azulejo-deep: #8FC7D6;
      --sol: #E8B85C;
      --clavel: #E07A6C;
      --line: #3A3226;
      --card: #241F18;
      --chip-bg: #2E2820;
      --chip-active-bg: #6FB3C4;
      --chip-active-fg: #1B1712;
      --shadow: rgba(0,0,0,0.35);
      --known-bg: #223522;
      --known-fg: #9ED17E;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1712;
    --ink: #F2ECDF;
    --ink-soft: #B8AC94;
    --azulejo: #6FB3C4;
    --azulejo-deep: #8FC7D6;
    --sol: #E8B85C;
    --clavel: #E07A6C;
    --line: #3A3226;
    --card: #241F18;
    --chip-bg: #2E2820;
    --chip-active-bg: #6FB3C4;
    --chip-active-fg: #1B1712;
    --shadow: rgba(0,0,0,0.35);
    --known-bg: #223522;
    --known-fg: #9ED17E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 em {
    font-style: italic;
    color: var(--clavel);
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 6px 0 22px;
    max-width: 46ch;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .progress-bar {
    width: 96px;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--azulejo);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  nav.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  nav.tabs button {
    font-family: 'Karla', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 10px 4px;
    margin-right: 22px;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  nav.tabs button.active {
    color: var(--ink);
    border-bottom: 2px solid var(--clavel);
  }

  .searchbox {
    position: relative;
    margin-bottom: 14px;
  }
  .searchbox input {
    width: 100%;
    padding: 11px 14px;
    font-size: 15px;
    font-family: 'Karla', sans-serif;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .searchbox input:focus {
    border-color: var(--azulejo);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }
  .chip {
    font-size: 12.5px;
    padding: 6px 11px;
    border-radius: 20px;
    background: var(--chip-bg);
    color: var(--ink-soft);
    cursor: pointer;
    border: none;
    font-family: 'Karla', sans-serif;
    font-weight: 500;
    white-space: nowrap;
  }
  .chip.active {
    background: var(--chip-active-bg);
    color: var(--chip-active-fg);
  }

  .count-line {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .list { display: flex; flex-direction: column; gap: 8px; }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .row.known { background: var(--known-bg); border-color: transparent; }

  .row .num {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--ink-soft);
    min-width: 28px;
    padding-top: 2px;
  }

  .row .body { flex: 1; min-width: 0; }

  .row .es-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row .es {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17.5px;
    color: var(--azulejo-deep);
  }
  .row .pron {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .row .kr {
    font-size: 15px;
    margin-top: 3px;
    font-weight: 500;
  }
  .row .ex {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 5px;
    line-height: 1.5;
  }

  .know-btn {
    border: none;
    background: none;
    cursor: pointer;
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--line);
    font-size: 16px;
  }
  .row.known .know-btn { color: var(--known-fg); }
  .know-btn:hover { color: var(--sol); }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 14.5px;
  }

  /* Flashcard mode */
  .flash-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
  }
  .flash-progress {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .card-stage {
    width: 100%;
    max-width: 460px;
    aspect-ratio: 4 / 3;
    perspective: 1400px;
    margin-bottom: 22px;
  }
  .flip-card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 4px 18px var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
  }
  .face.back { transform: rotateY(180deg); background: var(--azulejo-deep); border-color: var(--azulejo-deep); }
  .face .tag {
    position: absolute;
    top: 16px;
    left: 18px;
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .face.back .tag { color: rgba(251,246,236,0.65); }

  .copy-btn {
    position: absolute;
    top: 12px;
    right: 14px;
    border: none;
    background: none;
    cursor: pointer;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    z-index: 2;
  }
  .copy-btn:hover { background: var(--chip-bg); color: var(--azulejo-deep); }
  .face.back .copy-btn { color: rgba(251,246,236,0.7); }
  .face.back .copy-btn:hover { background: rgba(255,255,255,0.14); color: var(--paper); }
  .copy-btn svg { width: 16px; height: 16px; }
  .copy-btn.copied { color: var(--known-fg); }
  .face.back .copy-btn.copied { color: #9ED17E; }

  .row { position: relative; }
  .row .copy-btn {
    position: static;
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
  .face .es-big {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    color: var(--azulejo-deep);
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .face .pron-big {
    font-size: 16px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .face .hint {
    position: absolute;
    bottom: 16px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .face.back .hint { color: rgba(251,246,236,0.55); }
  .face.back .kr-big {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--paper);
    margin-bottom: 12px;
  }
  .face.back .ex-big {
    font-size: 14px;
    color: rgba(251,246,236,0.85);
    line-height: 1.5;
    max-width: 34ch;
  }

  .flash-controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ctrl-btn {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ctrl-btn:active { transform: translateY(1px); }
  .ctrl-btn.primary { background: var(--azulejo); color: var(--paper); border-color: var(--azulejo); }
  .ctrl-btn.ghost-sol { color: var(--sol); border-color: var(--sol); background: none; }

  .flash-secondary {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .flash-secondary button {
    font-size: 12.5px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  ::selection { background: var(--sol); color: var(--ink); }

  @media (max-width: 480px) {
    h1 { font-size: 25px; }
    .row .es { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>스페인어<br><em>생활단어</em> 1000</h1>
    <div class="progress-row">
      <span id="progressLabel">0 / 1000 암기</span>
      <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
    </div>
  </header>
  <p class="subtitle">틈날 때마다 리딩용으로 훑어보는 스페인어 생활 표현 모음. 목록을 읽거나 카드로 뒤집어가며 익혀보세요.</p>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="list">목록</button>
    <button class="tab-btn" data-tab="flash">카드로 학습</button>
  </nav>

  <div id="listView">
    <div class="searchbox">
      <input type="text" id="searchInput" placeholder="스페인어, 뜻, 발음으로 검색...">
    </div>
    <div class="chips" id="sectionChips"></div>
    <div class="count-line" id="countLine"></div>
    <div class="list" id="listContainer"></div>
  </div>

  <div id="flashView" style="display:none;">
    <div class="chips" id="flashChips"></div>
    <div class="flash-wrap">
      <div class="flash-progress" id="flashProgress"></div>
      <div class="card-stage">
        <div class="flip-card" id="flipCard">
          <div class="face front">
            <span class="tag" id="frontTag"></span>
            <button class="copy-btn" id="copyFrontBtn" aria-label="복사" title="복사">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <div class="es-big" id="frontEs"></div>
            <div class="pron-big" id="frontPron"></div>
            <span class="hint">탭하여 뜻 보기</span>
          </div>
          <div class="face back">
            <span class="tag">뜻</span>
            <button class="copy-btn" id="copyBackBtn" aria-label="복사" title="복사">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <div class="kr-big" id="backKr"></div>
            <div class="ex-big" id="backEx"></div>
            <span class="hint">탭하여 되돌리기</span>
          </div>
        </div>
      </div>
      <div class="flash-controls">
        <button class="ctrl-btn" id="prevBtn">← 이전</button>
        <button class="ctrl-btn ghost-sol" id="knowBtn">암기 완료</button>
        <button class="ctrl-btn primary" id="nextBtn">다음 →</button>
      </div>
      <div class="flash-secondary">
        <button id="shuffleBtn">랜덤 섞기</button>
        <button id="unknownOnlyBtn">모르는 것만</button>
      </div>
    </div>
  </div>
</div>

ion": "완성형 자연 회화"}, {"num": 990, "es": "con fe", "pron": "꼰 페", "kr": "믿음으로", "ex": "", "section": "완성형 자연 회화"}, {"num": 991, "es": "con esperanza", "pron": "꼰 에스뻬란사", "kr": "희망으로", "ex": "", "section": "완성형 자연 회화"}, {"num": 992, "es": "todo es cuestión de tiempo", "pron": "또도 에스 꾸에스띠온 데 띠엠뽀", "kr": "시간 문제다", "ex": "", "section": "완성형 자연 회화"}, {"num": 993, "es": "lo lograrás", "pron": "로 로그라라스", "kr": "너는 해낼 것이다", "ex": "", "section": "완성형 자연 회화"}, {"num": 994, "es": "confío en ti", "pron": "꼰피오 엔 띠", "kr": "너를 믿는다", "ex": "", "section": "완성형 자연 회화"}, {"num": 995, "es": "eres capaz", "pron": "에레스 까빠스", "kr": "너는 할 수 있다", "ex": "", "section": "완성형 자연 회화"}, {"num": 996, "es": "tú puedes", "pron": "뚜 뿌에데스", "kr": "너는 할 수 있다", "ex": "", "section": "완성형 자연 회화"}, {"num": 997, "es": "sí se puede", "pron": "씨 세 뿌에데", "kr": "할 수 있다", "ex": "", "section": "완성형 자연 회화"}, {"num": 998, "es": "vamos juntos", "pron": "바모스 훈또스", "kr": "함께 가자", "ex": "", "section": "완성형 자연 회화"}, {"num": 999, "es": "estamos contigo", "pron": "에스따모스 꼰띠고", "kr": "함께 있다", "ex": "", "section": "완성형 자연 회화"}, {"num": 1000, "es": "todo irá bien", "pron": "또도 이라 비엔", "kr": "다 잘 될 것이다", "ex": "", "section": "완성형 자연 회화"}];
const SECTIONS = ["기본 명사/사람/사물", "기본 동사", "형용사", "일상 표현", "생활 필수", "식당 기본", "식당 표현", "쇼핑 기본", "여행 기본", "여행 표현 확장", "직장 기본 명사", "직장 동사", "일상 회화 기본", "감정/상태", "일상 표현 확장", "문제/계획/행동", "형용사 + 핵심 표현", "행동/상황 표현", "실전 회화 문장", "병원/건강", "은행/금융", "문제/긴급 상황", "긴급 표현 + 행동", "상태/문장 확장", "감정/관계 명사·동사", "관계/표현", "실전 감정 표현 문장", "자연 회화 핵심 표현", "원어민 연결 표현", "고급 동사 표현", "고급 회화 문장", "완성형 자연 회화"];
const STORAGE_KEY = 'sp1000-known-v1';
const POS_KEY = 'sp1000-flashpos-v1';

function loadKnown() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) { return new Set(); }
}
function saveKnown(set) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch (e) {}
}

let known = loadKnown();
let activeSection = 'all';
let searchTerm = '';

function updateProgress() {
  const label = document.getElementById('progressLabel');
  const fill = document.getElementById('progressFill');
  const pct = Math.round((known.size / WORDS.length) * 100);
  label.textContent = known.size + ' / ' + WORDS.length + ' 암기';
  fill.style.width = pct + '%';
}

function toggleKnown(num) {
  if (known.has(num)) known.delete(num); else known.add(num);
  saveKnown(known);
  updateProgress();
}

/* ---------- List view ---------- */
function buildChips() {
  const container = document.getElementById('sectionChips');
  const chip = document.createElement('button');
  chip.className = 'chip active';
  chip.textContent = '전체';
  chip.dataset.section = 'all';
  container.appendChild(chip);
  SECTIONS.forEach(sec => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = sec;
    c.dataset.section = sec;
    container.appendChild(c);
  });
  container.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    activeSection = btn.dataset.section;
    [...container.children].forEach(c => c.classList.toggle('active', c === btn));
    renderList();
  });
}

function filteredWords() {
  const term = searchTerm.trim().toLowerCase();
  return WORDS.filter(w => {
    if (activeSection !== 'all' && w.section !== activeSection) return false;
    if (!term) return true;
    return w.es.toLowerCase().includes(term) ||
           w.kr.toLowerCase().includes(term) ||
           w.pron.toLowerCase().includes(term) ||
           (w.ex && w.ex.toLowerCase().includes(term));
  });
}

function renderList() {
  const container = document.getElementById('listContainer');
  const items = filteredWords();
  document.getElementById('countLine').textContent = items.length + '개 단어/표현';
  if (items.length === 0) {
    container.innerHTML = '<div class="empty-state">검색 결과가 없습니다.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  items.forEach(w => {
    const row = document.createElement('div');
    row.className = 'row' + (known.has(w.num) ? ' known' : '');
    row.innerHTML =
      '<div class="num">' + w.num + '</div>' +
      '<div class="body">' +
        '<div class="es-line"><span class="es">' + escapeHtml(w.es) + '</span>' +
        (w.pron ? '<span class="pron">(' + escapeHtml(w.pron) + ')</span>' : '') + '</div>' +
        '<div class="kr">' + escapeHtml(w.kr) + '</div>' +
        (w.ex ? '<div class="ex">→ ' + escapeHtml(w.ex) + '</div>' : '') +
      '</div>' +
      '<button class="copy-btn" aria-label="복사" title="복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>' +
      '<button class="know-btn" aria-label="암기 표시">' + (known.has(w.num) ? '●' : '○') + '</button>';
    row.querySelector('.know-btn').addEventListener('click', () => {
      toggleKnown(w.num);
      renderList();
    });
    row.querySelector('.copy-btn').addEventListener('click', (e) => {
      copyWordToClipboard(w, e.currentTarget);
    });
    frag.appendChild(row);
  });
  container.innerHTML = '';
  container.appendChild(frag);
}

function copyWordToClipboard(w, btnEl) {
  let text = w.es + (w.pron ? ' (' + w.pron + ')' : '') + ' — ' + w.kr;
  if (w.ex) text += '\n' + w.ex;
  const done = () => {
    if (!btnEl) return;
    btnEl.classList.add('copied');
    const original = btnEl.innerHTML;
    btnEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    setTimeout(() => {
      btnEl.classList.remove('copied');
      btnEl.innerHTML = original;
    }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if (cb) cb();
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderList();
});

/* ---------- Flashcard view ---------- */
let flashDeck = [...WORDS];
let flashIndex = 0;
let flashSection = 'all';
let unknownOnly = false;

function buildFlashChips() {
  const container = document.getElementById('flashChips');
  const chip = document.createElement('button');
  chip.className = 'chip active';
  chip.textContent = '전체';
  chip.dataset.section = 'all';
  container.appendChild(chip);
  SECTIONS.forEach(sec => {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = sec;
    c.dataset.section = sec;
    container.appendChild(c);
  });
  container.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    flashSection = btn.dataset.section;
    [...container.children].forEach(c => c.classList.toggle('active', c === btn));
    rebuildDeck();
  });
}

function rebuildDeck() {
  flashDeck = WORDS.filter(w => {
    if (flashSection !== 'all' && w.section !== flashSection) return false;
    if (unknownOnly && known.has(w.num)) return false;
    return true;
  });
  flashIndex = 0;
  renderFlashCard();
}

function shuffleDeck() {
  for (let i = flashDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [flashDeck[i], flashDeck[j]] = [flashDeck[j], flashDeck[i]];
  }
  flashIndex = 0;
  renderFlashCard();
}

function renderFlashCard() {
  const progressEl = document.getElementById('flashProgress');
  const cardEl = document.getElementById('flipCard');
  cardEl.classList.remove('flipped');
  if (flashDeck.length === 0) {
    progressEl.textContent = '해당하는 단어가 없습니다';
    document.getElementById('frontEs').textContent = '';
    document.getElementById('frontPron').textContent = '';
    document.getElementById('frontTag').textContent = '';
    document.getElementById('backKr').textContent = '';
    document.getElementById('backEx').textContent = '';
    return;
  }
  const w = flashDeck[flashIndex];
  progressEl.textContent = (flashIndex + 1) + ' / ' + flashDeck.length + '  ·  ' + w.section;
  document.getElementById('frontTag').textContent = '#' + w.num;
  document.getElementById('frontEs').textContent = w.es;
  document.getElementById('frontPron').textContent = w.pron ? '(' + w.pron + ')' : '';
  document.getElementById('backKr').textContent = w.kr;
  document.getElementById('backEx').textContent = w.ex || '';
  document.getElementById('knowBtn').textContent = known.has(w.num) ? '암기 취소' : '암기 완료';
  savePos();
}

function savePos() {
  try { localStorage.setItem(POS_KEY, JSON.stringify({section: flashSection, index: flashIndex})); } catch(e) {}
}
function loadPos() {
  try {
    const raw = localStorage.getItem(POS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

document.getElementById('flipCard').addEventListener('click', () => {
  document.getElementById('flipCard').classList.toggle('flipped');
});
document.getElementById('copyFrontBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (flashDeck.length === 0) return;
  copyWordToClipboard(flashDeck[flashIndex], e.currentTarget);
});
document.getElementById('copyBackBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (flashDeck.length === 0) return;
  copyWordToClipboard(flashDeck[flashIndex], e.currentTarget);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (flashDeck.length === 0) return;
  flashIndex = (flashIndex + 1) % flashDeck.length;
  renderFlashCard();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (flashDeck.length === 0) return;
  flashIndex = (flashIndex - 1 + flashDeck.length) % flashDeck.length;
  renderFlashCard();
});
document.getElementById('knowBtn').addEventListener('click', () => {
  if (flashDeck.length === 0) return;
  toggleKnown(flashDeck[flashIndex].num);
  renderFlashCard();
});
document.getElementById('shuffleBtn').addEventListener('click', shuffleDeck);
document.getElementById('unknownOnlyBtn').addEventListener('click', (e) => {
  unknownOnly = !unknownOnly;
  e.target.style.color = unknownOnly ? 'var(--clavel)' : '';
  rebuildDeck();
});

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('listView').style.display = tab === 'list' ? 'block' : 'none';
    document.getElementById('flashView').style.display = tab === 'flash' ? 'block' : 'none';
  });
});

/* ---------- Init ---------- */
buildChips();
buildFlashChips();
renderList();
const savedPos = loadPos();
if (savedPos && SECTIONS.includes(savedPos.section)) {
  flashSection = savedPos.section;
  [...document.getElementById('flashChips').children].forEach(c => c.classList.toggle('active', c.dataset.section === flashSection));
}
rebuildDeck();
if (savedPos && savedPos.index < flashDeck.length) {
  flashIndex = savedPos.index;
  renderFlashCard();
}
updateProgress();
</script>
