<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>복음 초청 집회 - 초대합니다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;900&family=Noto+Sans+KR:wght@300;400;500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ec;
    --card:#f4eeda;
    --forest:#3d5a37;
    --forest-deep:#2c4228;
    --sage:#8aa07d;
    --sage-light:#b9c9ad;
    --gold:#c8a24e;
    --gold-light:#e2c98a;
    --ink:#2b2a22;
    --ink-soft:#4a4638;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:#e9e4d4;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
  }
  body{
    display:flex;
    justify-content:center;
    padding:36px 14px;
  }
  .sheet{
    position:relative;
    width:700px;
    max-width:100%;
    background:var(--cream);
    box-shadow:0 30px 70px -20px rgba(30,30,15,0.35), 0 0 0 1px rgba(200,162,78,0.15);
  }
  .sheet::before{
    content:'';
    position:absolute;
    inset:22px;
    border:1px solid rgba(200,162,78,0.45);
    pointer-events:none;
    z-index:3;
  }
  .invite{
    position:relative;
    min-height:960px;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(200,162,78,0.06), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(61,90,55,0.05), transparent 55%);
    overflow:hidden;
  }

  /* ---------- botanical corner ornaments ---------- */
  .corner{
    position:absolute;
    width:260px;
    height:260px;
    z-index:1;
    pointer-events:none;
  }
  .corner svg{width:100%;height:100%;display:block;}
  .corner.tl{top:-6px;left:-6px;}
  .corner.tr{top:-6px;right:-6px;transform:scaleX(-1);}
  .corner.bl{bottom:-6px;left:-6px;width:290px;height:290px;transform:scaleY(-1);}
  .corner.br{bottom:-6px;right:-6px;width:290px;height:290px;transform:scale(-1,-1);}

  /* loose petals scattered across the lower field, between the two corners */
  .petal-field{
    position:absolute;
    left:0; right:0; bottom:0;
    height:230px;
    z-index:1;
    pointer-events:none;
  }
  .petal-field svg{width:100%;height:100%;display:block;}
  .petal{fill:#e6b9a6;opacity:0.55;}
  .petal.rose{fill:#d9a58c;}
  .petal.pale{fill:#efe0c2;opacity:0.7;}
  .bud{fill:#7f9a70;}

  .gold-dot{fill:var(--gold);}
  .leaf-a{fill:#7f9a70;}
  .leaf-b{fill:#9db38c;opacity:0.9;}
  .leaf-outline{fill:none;stroke:#5c7650;stroke-width:1;opacity:0.5;}
  .petal-outer{fill:#fbf8ef;stroke:#d8cfae;stroke-width:0.6;}
  .petal-inner{fill:#f3ecd6;stroke:#d8cfae;stroke-width:0.5;}
  .petal-core{fill:#e9dcb8;}
  .twig{stroke:#8a7a4a;stroke-width:1.1;fill:none;opacity:0.6;}

  /* ---------- content ---------- */
  .content{
    position:relative;
    z-index:2;
    padding:96px 64px 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .eyebrow{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:0.32em;
    color:var(--forest);
    margin-bottom:6px;
    padding-left:0.32em; /* optical centering for letter-spacing */
  }

  .headline{
    font-family:'Nanum Myeongjo','Noto Serif KR',serif;
    font-weight:800;
    font-size:64px;
    color:var(--forest-deep);
    letter-spacing:0.06em;
    margin-top:8px;
    text-shadow:0 1px 0 rgba(255,255,255,0.5);
  }

  .rule{
    display:flex;
    flex-direction:column;
    gap:5px;
    width:210px;
    margin:34px 0 40px;
  }
  .rule span{
    display:block;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold) 85%, transparent);
  }
  .rule span:last-child{height:1px;opacity:0.6;}

  .quote-card{
    position:relative;
    width:100%;
    max-width:480px;
    background:var(--card);
    padding:38px 40px 34px;
    transform:rotate(-0.6deg);
    box-shadow:0 14px 30px -12px rgba(60,50,20,0.28);
    margin-bottom:46px;
  }
  .quote-card::before,
  .quote-card::after{
    content:'';
    position:absolute;
    width:14px;height:14px;
    border:1px solid var(--gold);
  }
  .quote-card::before{top:8px;left:8px;border-right:none;border-bottom:none;}
  .quote-card::after{bottom:8px;right:8px;border-left:none;border-top:none;}

  .quote-text{
    font-family:'Nanum Myeongjo','Noto Serif KR',serif;
    font-size:18.5px;
    line-height:1.85;
    color:var(--ink-soft);
    font-weight:400;
  }
  .quote-cite{
    margin-top:16px;
    font-family:'Noto Serif KR',serif;
    font-size:14px;
    letter-spacing:0.08em;
    color:var(--forest);
    font-weight:500;
  }
  .quote-cite::before,.quote-cite::after{content:'—';margin:0 8px;color:var(--gold);}

  .badge{
    display:inline-block;
    background:var(--forest);
    color:#f6f1de;
    font-family:'Noto Serif KR',serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:0.04em;
    padding:11px 34px;
    box-shadow:0 8px 18px -8px rgba(44,66,40,0.55);
    margin-bottom:22px;
  }

  .address{
    font-family:'Noto Sans KR',sans-serif;
    font-weight:400;
    font-size:15.5px;
    color:var(--ink-soft);
    letter-spacing:0.01em;
    margin-bottom:6px;
  }

  .church-name{
    font-family:'Nanum Myeongjo','Noto Serif KR',serif;
    font-weight:800;
    font-size:34px;
    letter-spacing:0.36em;
    padding-left:0.36em;
    color:var(--forest-deep);
    margin-top:6px;
  }

  .foot-spacer{
    margin-top:36px;
    display:flex;
    align-items:center;
    gap:10px;
    opacity:0.9;
  }
  .foot-spacer .diamond{
    width:6px;height:6px;
    background:var(--gold);
    transform:rotate(45deg);
  }
  .foot-spacer .line{
    width:44px;height:1px;
    background:var(--gold-light);
  }
  .foot-spacer .sprig{width:26px;height:16px;display:block;}
  .foot-spacer .sprig.right{transform:scaleX(-1);}

  @media (max-width:560px){
    .content{padding:80px 30px 46px;}
    .headline{font-size:46px;}
    .eyebrow{font-size:18px;}
    .church-name{font-size:26px;}
    .corner{width:170px;height:170px;}
    .quote-text{font-size:16px;}
  }

  /* ---------- article section: 인생의 비밀 (continues the same sheet) ---------- */
  .article-wrap{
    position:relative;
    padding:8px 56px 60px;
  }
  .a-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:8px;
  }
  .a-divider .line{width:70px;height:1px;background:var(--gold-light);}
  .a-divider .diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);}
  .a-eyebrow{
    text-align:center;
    font-family:'Noto Serif KR',serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.3em;
    padding-left:0.3em;
    color:var(--sage);
    margin-bottom:10px;
  }
  .a-title{
    text-align:center;
    font-family:'Nanum Myeongjo','Noto Serif KR',serif;
    font-weight:800;
    font-size:36px;
    color:var(--forest-deep);
    letter-spacing:0.04em;
    margin-bottom:44px;
  }
  .a-lead{
    font-family:'Noto Serif KR',serif;
    font-size:16.5px;
    line-height:2;
    color:var(--ink-soft);
    margin-bottom:30px;
  }
  .a-h{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:19px;
    color:var(--forest);
    margin:38px 0 16px;
    padding-left:15px;
    position:relative;
    line-height:1.5;
  }
  .a-h::before{
    content:'';
    position:absolute;
    left:0; top:3px; bottom:3px;
    width:3px;
    background:var(--gold);
  }
  .a-p{
    font-family:'Noto Sans KR',sans-serif;
    font-weight:400;
    font-size:15.5px;
    line-height:1.95;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .a-verse{
    background:var(--card);
    border-left:3px solid var(--gold);
    padding:16px 20px;
    margin:18px 0;
  }
  .a-verse p{
    font-family:'Noto Serif KR',serif;
    font-size:14.5px;
    line-height:1.85;
    color:var(--ink-soft);
  }
  .a-verse .ref{
    display:block;
    margin-top:8px;
    font-family:'Noto Serif KR',serif;
    font-size:12.5px;
    letter-spacing:0.06em;
    color:var(--forest);
    font-weight:600;
  }
  .a-img-wrap{
    margin:28px auto;
    max-width:480px;
  }
  .a-img{
    width:100%;
    height:auto;
    display:block;
    border:1px solid rgba(200,162,78,0.4);
    box-shadow:0 14px 30px -14px rgba(40,35,15,0.35);
  }
  .a-img-cap{
    text-align:center;
    font-family:'Noto Sans KR',sans-serif;
    font-size:12.5px;
    color:var(--sage);
    margin-top:8px;
    letter-spacing:0.02em;
  }
  .sin-diagram{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:36px;
    margin:30px auto;
    max-width:520px;
    flex-wrap:wrap;
  }
  .sin-circles{
    width:230px;
    height:230px;
    flex:0 0 auto;
  }
  .sin-notes{
    display:flex;
    flex-direction:column;
    gap:16px;
    flex:1 1 200px;
    min-width:180px;
  }
  .sin-note{
    font-family:'Noto Sans KR',sans-serif;
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .sin-note-head{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    color:#7a2f21;
    margin-right:2px;
  }
  .sin-note-ref{
    display:block;
    font-family:'Noto Serif KR',serif;
    font-size:12.5px;
    color:var(--forest);
    letter-spacing:0.04em;
    margin-top:2px;
  }
  @media (max-width:480px){
    .sin-diagram{gap:20px;justify-content:center;}
    .sin-circles{width:190px;height:190px;}
  }
  .a-closing{
    text-align:center;
    font-family:'Nanum Myeongjo','Noto Serif KR',serif;
    font-weight:700;
    font-size:20px;
    color:var(--forest-deep);
    line-height:1.7;
    margin:40px 0 8px;
  }
  .a-call{
    text-align:center;
    font-family:'Noto Serif KR',serif;
    font-weight:600;
    font-size:17px;
    color:var(--forest);
    letter-spacing:0.02em;
    margin:22px 0 6px;
  }
  .a-source{
    margin-top:48px;
    padding-top:20px;
    border-top:1px solid rgba(200,162,78,0.4);
    text-align:center;
    font-family:'Noto Sans KR',sans-serif;
    font-size:12.5px;
    color:#9a927c;
    line-height:1.8;
  }
  .a-source a{color:var(--forest);text-decoration:none;border-bottom:1px solid rgba(61,90,55,0.35);}

  @media (max-width:560px){
    .article-wrap{padding:52px 24px 44px;}
    .a-title{font-size:28px;}
    .a-lead,.a-p{font-size:14.5px;}
    .a-h{font-size:17px;}
    .a-closing{font-size:18px;}
  }
</style>
</head>
<body>

<div class="sheet">
<div class="invite">

  <!-- botanical corner ornaments -->
  <div class="corner tl">
    <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      <path class="twig" d="M10,250 C40,190 60,150 30,90 C15,60 25,30 60,10"/>
      <path class="twig" d="M10,250 C60,220 90,200 100,150"/>
      <!-- leaves along stem -->
      <ellipse class="leaf-a" cx="34" cy="120" rx="20" ry="9" transform="rotate(-35 34 120)"/>
      <ellipse class="leaf-b" cx="52" cy="150" rx="17" ry="7.5" transform="rotate(20 52 150)"/>
      <ellipse class="leaf-a" cx="20" cy="170" rx="18" ry="8" transform="rotate(-60 20 170)"/>
      <ellipse class="leaf-b" cx="70" cy="90" rx="15" ry="6.5" transform="rotate(-10 70 90)"/>
      <ellipse class="leaf-a" cx="46" cy="60" rx="16" ry="7" transform="rotate(-45 46 60)"/>
      <ellipse class="leaf-b" cx="85" cy="180" rx="14" ry="6" transform="rotate(40 85 180)"/>
      <!-- peony bloom -->
      <g transform="translate(58,42)">
        <circle class="petal-outer" r="26" cx="0" cy="0"/>
        <circle class="petal-inner" r="19" cx="-4" cy="3"/>
        <circle class="petal-outer" r="15" cx="9" cy="-6"/>
        <circle class="petal-inner" r="11" cx="2" cy="-2"/>
        <circle class="petal-core" r="6" cx="1" cy="0"/>
      </g>
      <circle class="gold-dot" cx="100" cy="60" r="2.4"/>
      <circle class="gold-dot" cx="16" cy="210" r="2"/>
      <circle class="gold-dot" cx="112" cy="140" r="1.6"/>
    </svg>
  </div>

  <div class="corner tr">
    <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      <path class="twig" d="M14,240 C70,220 120,210 150,160 C170,125 165,90 200,55"/>
      <ellipse class="leaf-a" cx="60" cy="222" rx="19" ry="8" transform="rotate(10 60 222)"/>
      <ellipse class="leaf-b" cx="100" cy="210" rx="17" ry="7.5" transform="rotate(-15 100 210)"/>
      <ellipse class="leaf-a" cx="140" cy="180" rx="16" ry="7" transform="rotate(30 140 180)"/>
      <ellipse class="leaf-b" cx="165" cy="130" rx="14" ry="6" transform="rotate(-25 165 130)"/>
      <ellipse class="leaf-a" cx="180" cy="90" rx="15" ry="6.5" transform="rotate(15 180 90)"/>
      <g transform="translate(206,44)">
        <circle class="petal-outer" r="22" cx="0" cy="0"/>
        <circle class="petal-inner" r="16" cx="4" cy="3"/>
        <circle class="petal-outer" r="12" cx="-7" cy="-5"/>
        <circle class="petal-core" r="5" cx="-1" cy="0"/>
      </g>
      <circle class="gold-dot" cx="120" cy="230" r="2"/>
      <circle class="gold-dot" cx="190" cy="150" r="1.8"/>
    </svg>
  </div>

  <div class="corner bl">
    <svg viewBox="0 0 290 290" xmlns="http://www.w3.org/2000/svg">
      <path class="twig" d="M10,280 C55,255 78,225 62,175 C50,140 62,108 44,72 C34,52 40,30 60,12"/>
      <path class="twig" d="M10,280 C68,250 100,230 100,180"/>
      <!-- generous leaf clusters along both stems -->
      <ellipse class="leaf-a" cx="46" cy="210" rx="20" ry="9" transform="rotate(-25 46 210)"/>
      <ellipse class="leaf-b" cx="68" cy="182" rx="17" ry="7.5" transform="rotate(30 68 182)"/>
      <ellipse class="leaf-a" cx="30" cy="235" rx="18" ry="8" transform="rotate(-55 30 235)"/>
      <ellipse class="leaf-b" cx="86" cy="150" rx="16" ry="7" transform="rotate(-10 86 150)"/>
      <ellipse class="leaf-a" cx="55" cy="128" rx="17" ry="7.5" transform="rotate(-45 55 128)"/>
      <ellipse class="leaf-b" cx="34" cy="100" rx="15" ry="6.5" transform="rotate(15 34 100)"/>
      <ellipse class="leaf-a" cx="94" cy="205" rx="14" ry="6" transform="rotate(45 94 205)"/>
      <ellipse class="leaf-b" cx="58" cy="70" rx="14" ry="6" transform="rotate(-30 58 70)"/>
      <!-- unopened buds -->
      <ellipse class="bud" cx="72" cy="120" rx="7" ry="10" transform="rotate(-15 72 120)"/>
      <ellipse class="bud" cx="26" cy="160" rx="6" ry="9" transform="rotate(20 26 160)"/>
      <!-- large peony -->
      <g transform="translate(58,44)">
        <circle class="petal-outer" r="27" cx="0" cy="0"/>
        <circle class="petal-inner" r="20" cx="-4" cy="3"/>
        <circle class="petal-outer" r="16" cx="9" cy="-6"/>
        <circle class="petal-inner" r="12" cx="2" cy="-2"/>
        <circle class="petal-core" r="6" cx="1" cy="0"/>
      </g>
      <!-- companion smaller bloom lower on the stem -->
      <g transform="translate(96,168)">
        <circle class="petal-outer" r="17" cx="0" cy="0"/>
        <circle class="petal-inner" r="12" cx="3" cy="2"/>
        <circle class="petal-outer" r="9" cx="-6" cy="-4"/>
        <circle class="petal-core" r="4.5" cx="-1" cy="0"/>
      </g>
      <circle class="gold-dot" cx="102" cy="70" r="2.2"/>
      <circle class="gold-dot" cx="18" cy="245" r="2"/>
      <circle class="gold-dot" cx="128" cy="150" r="1.6"/>
      <circle class="gold-dot" cx="80" cy="238" r="1.6"/>
    </svg>
  </div>

  <div class="corner br">
    <svg viewBox="0 0 290 290" xmlns="http://www.w3.org/2000/svg">
      <path class="twig" d="M14,270 C75,245 130,230 165,175 C188,138 182,98 220,58"/>
      <path class="twig" d="M14,270 C90,255 140,235 150,190"/>
      <ellipse class="leaf-a" cx="70" cy="248" rx="19" ry="8" transform="rotate(8 70 248)"/>
      <ellipse class="leaf-b" cx="112" cy="232" rx="17" ry="7.5" transform="rotate(-15 112 232)"/>
      <ellipse class="leaf-a" cx="150" cy="200" rx="16" ry="7" transform="rotate(28 150 200)"/>
      <ellipse class="leaf-b" cx="178" cy="150" rx="15" ry="6.5" transform="rotate(-25 178 150)"/>
      <ellipse class="leaf-a" cx="196" cy="105" rx="15" ry="6.5" transform="rotate(15 196 105)"/>
      <ellipse class="leaf-b" cx="130" cy="215" rx="14" ry="6" transform="rotate(-40 130 215)"/>
      <ellipse class="leaf-a" cx="205" cy="140" rx="13" ry="5.5" transform="rotate(-5 205 140)"/>
      <ellipse class="leaf-b" cx="160" cy="235" rx="13" ry="5.5" transform="rotate(40 160 235)"/>
      <!-- unopened buds -->
      <ellipse class="bud" cx="184" cy="118" rx="7" ry="10" transform="rotate(10 184 118)"/>
      <ellipse class="bud" cx="140" cy="230" rx="6" ry="9" transform="rotate(-20 140 230)"/>
      <!-- large peony -->
      <g transform="translate(222,46)">
        <circle class="petal-outer" r="23" cx="0" cy="0"/>
        <circle class="petal-inner" r="17" cx="4" cy="3"/>
        <circle class="petal-outer" r="13" cx="-8" cy="-5"/>
        <circle class="petal-inner" r="9" cx="-2" cy="-1"/>
        <circle class="petal-core" r="5" cx="-1" cy="0"/>
      </g>
      <!-- companion smaller bloom lower on the stem -->
      <g transform="translate(148,196)">
        <circle class="petal-outer" r="16" cx="0" cy="0"/>
        <circle class="petal-inner" r="11" cx="-3" cy="2"/>
        <circle class="petal-outer" r="8" cx="6" cy="-4"/>
        <circle class="petal-core" r="4" cx="1" cy="0"/>
      </g>
      <circle class="gold-dot" cx="132" cy="258" r="2"/>
      <circle class="gold-dot" cx="205" cy="165" r="1.8"/>
      <circle class="gold-dot" cx="90" cy="270" r="1.6"/>
    </svg>
  </div>

  <!-- drifting fallen petals across the lower field, tying both corners together -->
  <div class="petal-field">
    <svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <ellipse class="petal" cx="150" cy="60" rx="7" ry="4" transform="rotate(25 150 60)"/>
      <ellipse class="petal rose" cx="210" cy="110" rx="6" ry="3.5" transform="rotate(-30 210 110)"/>
      <ellipse class="petal pale" cx="180" cy="150" rx="5.5" ry="3" transform="rotate(60 180 150)"/>
      <ellipse class="petal" cx="270" cy="80" rx="6.5" ry="3.6" transform="rotate(-10 270 80)"/>
      <ellipse class="petal rose" cx="330" cy="130" rx="6" ry="3.4" transform="rotate(40 330 130)"/>
      <ellipse class="petal pale" cx="380" cy="70" rx="5.5" ry="3" transform="rotate(-45 380 70)"/>
      <ellipse class="petal" cx="420" cy="120" rx="6.5" ry="3.6" transform="rotate(15 420 120)"/>
      <ellipse class="petal rose" cx="470" cy="90" rx="6" ry="3.4" transform="rotate(-20 470 90)"/>
      <ellipse class="petal pale" cx="500" cy="145" rx="5.5" ry="3" transform="rotate(50 500 145)"/>
      <ellipse class="petal" cx="540" cy="100" rx="6.5" ry="3.6" transform="rotate(-35 540 100)"/>
      <ellipse class="petal rose" cx="560" cy="150" rx="6" ry="3.4" transform="rotate(20 560 150)"/>
      <circle class="gold-dot" cx="240" cy="45" r="1.6"/>
      <circle class="gold-dot" cx="350" cy="95" r="1.4"/>
      <circle class="gold-dot" cx="450" cy="55" r="1.6"/>
      <circle class="gold-dot" cx="310" cy="160" r="1.3"/>
    </svg>
